<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title>IV membrane orientation</title><rect width="1240" height="662" fill="#ffffff"/><defs><pattern id="sphatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbcfe8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#db2777" stroke-width="3"/></pattern></defs><text x="80" y="32" font-size="24" font-weight="800" fill="#14263a">IV · predicted membrane orientation</text><text x="80" y="54" font-size="14" fill="#5b6470">Enterobacteria phage M13 · phage assembly protein · 426 aa · computational predictions</text><g transform="translate(0,70)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">Phobius</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="53.2" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–21</title></rect><rect x="133.2" y="50" width="1026.8" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 22–426</title></rect><line x1="106.6" y1="74" x2="106.6" y2="86" stroke="#94a3b8"/><text x="82" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–21</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><g transform="translate(0,218)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">DeepTMHMM</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">β-barrel-type prediction: linear map (P = periplasm, O = extracellular; no α-helical cartoon)</text><rect x="80" y="50" width="53.2" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–21</title></rect><rect x="133.2" y="50" width="453.8" height="24" rx="3" fill="#65a30d" stroke="none"><title>Periplasm (β-barrel model) 22–200</title></rect><rect x="587" y="50" width="12.7" height="24" rx="3" fill="#0891b2" stroke="none"><title>Membrane span (β-strand) 201–205</title></rect><rect x="599.7" y="50" width="385.4" height="24" rx="3" fill="#d97706" stroke="none"><title>Outside (non-cytoplasmic) 206–357</title></rect><rect x="985.1" y="50" width="20.3" height="24" rx="3" fill="#0891b2" stroke="none"><title>Membrane span (β-strand) 358–365</title></rect><rect x="1005.4" y="50" width="20.3" height="24" rx="3" fill="#65a30d" stroke="none"><title>Periplasm (β-barrel model) 366–373</title></rect><rect x="1025.6" y="50" width="12.7" height="24" rx="3" fill="#0891b2" stroke="none"><title>Membrane span (β-strand) 374–378</title></rect><rect x="1038.3" y="50" width="88.7" height="24" rx="3" fill="#d97706" stroke="none"><title>Outside (non-cytoplasmic) 379–413</title></rect><rect x="1127" y="50" width="12.7" height="24" rx="3" fill="#0891b2" stroke="none"><title>Membrane span (β-strand) 414–418</title></rect><rect x="1139.7" y="50" width="20.3" height="24" rx="3" fill="#65a30d" stroke="none"><title>Periplasm (β-barrel model) 419–426</title></rect><line x1="106.6" y1="74" x2="106.6" y2="86" stroke="#94a3b8"/><text x="82" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–21</text><line x1="360.1" y1="74" x2="360.1" y2="86" stroke="#94a3b8"/><text x="298.9" y="98" font-size="14" font-weight="600" fill="#65a30d">Periplasm 22–200</text><line x1="593.4" y1="74" x2="593.4" y2="86" stroke="#94a3b8"/><text x="544.2" y="98" font-size="14" font-weight="600" fill="#0891b2">β-TM 201–205</text><line x1="792.4" y1="74" x2="792.4" y2="86" stroke="#94a3b8"/><text x="718.5" y="98" font-size="14" font-weight="600" fill="#d97706">Extracellular 206–357</text><line x1="995.2" y1="74" x2="995.2" y2="86" stroke="#94a3b8"/><text x="944.7" y="98" font-size="14" font-weight="600" fill="#0891b2">β-TM 358–365</text><line x1="1015.5" y1="74" x2="1015.5" y2="104" stroke="#94a3b8"/><text x="950.3" y="116" font-size="14" font-weight="600" fill="#65a30d">Periplasm 366–373</text><line x1="1032" y1="74" x2="1032" y2="122" stroke="#94a3b8"/><text x="982.5" y="134" font-size="14" font-weight="600" fill="#0891b2">β-TM 374–378</text><line x1="1082.7" y1="74" x2="1082.7" y2="140" stroke="#94a3b8"/><text x="1010.3" y="152" font-size="14" font-weight="600" fill="#d97706">Extracellular 379–413</text><line x1="1133.4" y1="74" x2="1133.4" y2="86" stroke="#94a3b8"/><text x="1064.4" y="98" font-size="14" font-weight="600" fill="#0891b2">β-TM 414–418</text><line x1="1149.9" y1="74" x2="1149.9" y2="158" stroke="#94a3b8"/><text x="1031.4" y="170" font-size="14" font-weight="600" fill="#65a30d">Periplasm 419–426</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="194" font-size="12.5" fill="#5b6470">DeepTMHMM β-type states: B = membrane β-strand, P = periplasm, O = "outside" (extracellular side of an outer membrane, per the model's own output labels). Predicted, not demonstrated.</text></g><g transform="translate(0,456)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">TOPCONS2</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="53.2" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–21</title></rect><rect x="133.2" y="50" width="1026.8" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 22–426</title></rect><line x1="106.6" y1="74" x2="106.6" y2="86" stroke="#94a3b8"/><text x="82" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–21</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><text x="80" y="614" font-size="12.5" fill="#374151">Scale: horizontal extent of every loop, tail and span ∝ residue count on one shared axis (1 aa = 2.5 px). Membrane depth, loop height and path shape are schematic, not physical distances or a 3D fold.</text><text x="80" y="632" font-size="12.5" fill="#374151">Inside/outside are model-defined sides of a membrane; for a phage protein the relevant host membrane is not assigned here. Signal peptides use precursor numbering; cleavage is predicted, not demonstrated.</text></svg>