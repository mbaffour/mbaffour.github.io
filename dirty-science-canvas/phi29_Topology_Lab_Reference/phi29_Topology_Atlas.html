:root{--bg:#f5f4f0;--panel:#fff;--ink:#17202a;--muted:#5b6470;--line:#d9dce1;--accent:#1f4e79;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
a{color:var(--accent)}
header.top{padding:12px 20px;background:#13263b;color:#fff;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}

.layout{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 50px)}

main{padding:16px 22px 60px;min-width:0}

.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px;font-size:13.5px}
.meta div{overflow-wrap:anywhere}
.meta div span{color:var(--muted)}
.seqbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;background:#f7f7f5;border:1px solid var(--line);border-radius:6px;padding:8px;max-height:140px;overflow:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
.card table{display:block;overflow-x:auto;max-width:100%}
code{word-break:break-all}
th,td{border-bottom:1px solid #e6e8eb;padding:4px 6px;text-align:left;vertical-align:top}
th{background:#f3f4f6;font-weight:600}
.st-complete{color:#166534;font-weight:600}.st-pending{color:var(--warn);font-weight:600}

.toggles fieldset{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0}

.figbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px}
.figbar .sp{flex:1}
.figwrap{overflow:auto;border:1px solid #eceef1;border-radius:8px;background:#fff}
.figwrap svg{display:block;max-width:none}
.figwrap.fit svg{max-width:100%;height:auto}
.caption{font-size:12.5px;color:#333;background:#f8f8f6;border-left:3px solid #9fb7d3;padding:6px 9px;margin-top:8px}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{border-left:4px solid var(--warn);background:#fff7ed;padding:8px 10px;font-size:13px;margin:8px 0;border-radius:4px}

.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.25)}
.toast{position:fixed;bottom:16px;right:16px;background:#13263b;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:80vw}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:#13263b;color:#fff;border-color:#13263b}
.small{font-size:12px;overflow-wrap:anywhere}
.rerun{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rerun form{margin:0}
img.rawplot{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
pre.cmd{background:#0f1b2a;color:#e5edf5;padding:8px 10px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
details summary{cursor:pointer;font-weight:600;margin:6px 0}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
const ORGS = DATA.organisms, ORDER = DATA.order, P = DATA.proteins;
const MAIN = DATA.main_methods, COMP = DATA.component_methods, ALLM = MAIN.concat(COMP);
const REPO = DATA.repo, WF = DATA.workflow;
// expand compact fields: status ('complete' where a prediction exists; components inherit TOPCONS2's status) and single-replicon accession
for(const p of P){ const st=p.status||{}; const full={};
  for(const m of MAIN.concat(COMP)) full[m] = p.pred&&p.pred[m] ? 'complete' : (st[m] || (COMP.includes(m) ? (st.TOPCONS2 || (p.pred&&p.pred.TOPCONS2?'no_output_returned':'pending')) : 'pending'));

// ---------------- palette & typography ----------------
const ST_COL = {I:'#0f8b80',O:'#d97706',M:'#1e293b',S:'#db2777',B:'#0891b2',P:'#65a30d'};
const ST_TXT = {I:'#0b6b62',O:'#9a4d03',M:'#1e293b',S:'#9d174d',B:'#0e7490',P:'#3f6212'};
const ST_NAME = {I:'Inside (cytoplasmic side)',O:'Outside (non-cytoplasmic)',M:'Membrane span (α-helix)',S:'Signal peptide (precursor)',B:'Membrane span (β-strand)',P:'Periplasm (β-barrel model)'};
const ST_SHORT = {I:'Inside',O:'Outside',M:'TM',S:'SP',B:'β-TM',P:'Periplasm'};
const CH = {pos:'#1d4ed8',neg:'#dc2626',his:'#8b5cf6',hyd:'#f1dcae',oth:'#ffffff',unk:'#9ca3af'};
const FONT = 'Helvetica Neue, Helvetica, Arial, sans-serif';
const MONO = 'Menlo, Consolas, DejaVu Sans Mono, monospace';
const STD = new Set('ACDEFGHIKLMNPQRSTVWY'.split(''));
function chClass(a){ if(a==='K'||a==='R')return'pos'; if(a==='D'||a==='E')return'neg'; if(a==='H')return'his'; if('AVILMFWY'.includes(a))return'hyd'; if(STD.has(a))return'oth'; return'unk'; }
const CH_LABEL = {pos:'K/R — generally positive side chain',neg:'D/E — generally negative side chain',his:'H — variable protonation (not a fixed charge)',hyd:'A/V/I/L/M/F/W/Y — declared hydrophobic/aromatic class (not a hydropathy prediction)',oth:'Other standard residues (unmarked)',unk:'Non-standard / unsupported symbol'};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2600);}
function pname(p){ return p.gene || p.curator_alias || p.locus_tag || p.protein_id; }
function safe(s){ return String(s).replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,''); }
function org(p){ return ORGS[p.org]; }
function rr(n){ return Math.round(n*10)/10; }
// ---------------- segments -> per-residue labels ----------------
function ex(p){ if(p._x) return p; p._x=true;
  for(const [m,pr] of Object.entries(p.pred||{})){
    pr.segments = pr.seg.split(',').map(t=>{const r=/^([A-Za-z])(\d+)-(\d+)$/.exec(t); return {label:r[1],start:+r[2],stop:+r[3]};});
    pr.labels = pr.segments.map(g=>g.label.repeat(g.stop-g.start+1)).join('');
    if(pr.labels.length!==p.length) console.error('segment expansion length mismatch',p.protein_id,m);
    const sp=pr.segments.filter(g=>g.label==='S'), spans=pr.segments.filter(g=>g.label==='M'||g.label==='B');
    pr.spans=spans.map(g=>[g.start,g.stop,g.label]); pr.sp_range=sp.length?[sp[0].start,sp[sp.length-1].stop]:null;
    if(!pr.nseg) pr.nseg = m==='DeepTMHMM' ? pr.seg : pr.seg.replace(/I(?=\d)/g,'i').replace(/O(?=\d)/g,'o');
    pr.src = (m==='Phobius') ? `raw/Phobius/${pr.batch}.json` : (m==='DeepTMHMM' ? `raw/DeepTMHMM/${pr.batch}/results/predicted_topologies.3line` : ((p.topcons_meta||{}).src||''));
  } return p; }
// ---------------- text measurement & wrapping ----------------
let mctx=null;
function textW(t,size,weight){ if(!mctx) mctx=document.createElement('canvas').getContext('2d'); mctx.font=`${weight||400} ${size}px ${FONT}`; return mctx.measureText(String(t)).width; }
function wrap(text,size,weight,maxW){ const words=String(text).split(' '); const lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(textW(t,size,weight)<=maxW||!cur) cur=t; else { lines.push(cur); cur=w; } } if(cur) lines.push(cur); return lines; }
function tblock(x,y,text,size,weight,fill,maxW,lh){ const L=wrap(text,size,weight,maxW); lh=lh||Math.round(size*1.35);
  return {svg:L.map((l,i)=>`<text class="t" x="${rr(x)}" y="${rr(y+i*lh)}" font-size="${size}" font-weight="${weight||400}" fill="${fill}">${esc(l)}</text>`).join(''), h:L.length*lh}; }
function svgOpen(w,h,title){ return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(w)}" height="${Math.ceil(h)}" viewBox="0 0 ${Math.ceil(w)} ${Math.ceil(h)}" font-family="${FONT}"><title>${esc(title)}</title><rect width="100%" height="100%" fill="#ffffff"/>`; }
// ---------------- collision-free lane placement ----------------
// items [{cx,w}] -> lanes used (>=0) or -1. Guarantees: no two label boxes overlap; each label's vertical leader (at cx, crossing all
// lanes nearer the anchor) never passes through another label box; leaders are >= MIN_LEADER_GAP apart; fixed vertical obstacles
// (e.g. signal-peptide connectors) never pass through a box.
const PAD=8, MIN_LEADER_GAP=6;
function placeLanes(items,o){ if(!items.length) return 0; const placed=[]; const obs=o.obstacles||[];
  const order=items.map((_,i)=>i).sort((a,b)=>items[a].cx-items[b].cx);
  for(const i of order){ const it=items[i]; let done=false;
    for(const q of placed) if(Math.abs(q.cx-it.cx)<MIN_LEADER_GAP) return -1;
    for(const ox of obs) if(Math.abs(ox-it.cx)<MIN_LEADER_GAP) return -1;
    const cands=[it.cx-it.w/2, it.cx-6, it.cx-it.w+6].map(x=>Math.max(o.minX,Math.min(o.maxX-it.w,x)));
    for(let lane=0; lane<o.maxLanes && !done; lane++){
      for(const x0 of cands){ const x1=x0+it.w; if(it.cx<x0-0.5||it.cx>x1+0.5) continue; let ok=true;
        for(const q of placed){
          if(q.lane===lane && x0<q.x1+PAD && x1>q.x0-PAD){ok=false;break;}
          if(q.lane>lane && q.cx>x0-PAD && q.cx<x1+PAD){ok=false;break;}
          if(q.lane<lane && it.cx>q.x0-PAD && it.cx<q.x1+PAD){ok=false;break;}
        }
        if(ok) for(const ox of obs) if(ox>x0-PAD && ox<x1+PAD){ok=false;break;}
        if(ok){ it.x0=x0; it.lane=lane; placed.push({x0,x1,lane,cx:it.cx}); done=true; break; }

    }
    if(!done) return -1;
  }
  return Math.max(...placed.map(q=>q.lane))+1; }
let LID=0;
function leader(x,y1,y2,id){ return `<line class="ldr" data-for="${id}" x1="${rr(x)}" y1="${rr(y1)}" x2="${rr(x)}" y2="${rr(y2)}" stroke="#8b95a3" stroke-width="1"/>`; }
function badge(cx,cy,t,r){ r=r||14; return `<g class="badge"><circle cx="${rr(cx)}" cy="${rr(cy)}" r="${r}" fill="#13263b"/><text class="bt" x="${rr(cx)}" y="${rr(cy+r*0.38)}" font-size="${Math.round(r*1.12)}" font-weight="700" text-anchor="middle" fill="#fff">${t}</text></g>`; }
function segKey(items,x,y,maxW){ if(!items.length) return {svg:'',h:0}; const size=13.5; const cw=Math.max(...items.map(it=>textW(it.text,size,600)))+34; const cols=Math.max(1,Math.floor(maxW/cw));
  let s=`<text class="t" x="${rr(x)}" y="${rr(y)}" font-size="12.5" font-weight="700" fill="#374151">Segment key (positions on the residue axis below)</text>`;
  items.forEach((it,i)=>{ const cx=x+(i%cols)*cw, cy=y+21+Math.floor(i/cols)*20; s+=`<rect x="${rr(cx)}" y="${rr(cy-10)}" width="12" height="12" rx="2" fill="${it.fill}"/><text class="t" x="${rr(cx+18)}" y="${rr(cy)}" font-size="${size}" font-weight="600" fill="${it.col}">${esc(it.text)}</text>`; });
  return {svg:s,h:21+Math.ceil(items.length/cols)*20}; }
function niceStep(L,px){ const target=L/(px/80); const c=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000]; return c.find(v=>v>=target)||5000; }
function axis(left,tw,L,y,sc){ const st=niceStep(L,tw); const tk=[1]; for(let v=st;v<L;v+=st) tk.push(v);
  const endX=left+(L-0.5)*sc, endW=textW(String(L),12);
  while(tk.length>1 && left+(tk[tk.length-1]-0.5)*sc+textW(String(tk[tk.length-1]),12)/2 > endX-endW/2-8) tk.pop();
  if(L>1) tk.push(L);
  let s=`<line x1="${left}" y1="${y}" x2="${left+tw}" y2="${y}" stroke="#6b7280"/>`;
  tk.forEach(v=>{ const X=left+(v-0.5)*sc; s+=`<line x1="${rr(X)}" y1="${y}" x2="${rr(X)}" y2="${y+5}" stroke="#6b7280"/><text class="t" x="${rr(X)}" y="${y+18}" font-size="12" text-anchor="middle" fill="#374151">${v}</text>`; });
  s+=`<text class="t" x="${left+tw}" y="${y+36}" font-size="11.5" text-anchor="end" fill="#5b6470">residue position (aa)</text>`; return {svg:s,h:42}; }

// ======================= Figure A: orientation =======================
function figOrientation(p,methods){ ex(p); const L=p.length, left=80, W=1240, tw=W-160, sc=tw/L; LID=0;
  const panels=methods.map(m=>orientationPanel(p,m,left,tw,sc,W)); const anyKey=panels.some(pa=>pa.keyed);
  const head1=tblock(20,32,`${pname(p)} · predicted membrane orientation`,24,700,'#13263b',W-40);
  const head2=tblock(20,32+head1.h,`${org(p).name} · ${p.product} · ${L} aa · computational predictions`,14,400,'#5b6470',W-40);
  let y=32+head1.h+head2.h+4, body='';
  panels.forEach(pa=>{ body+=`<g transform="translate(0,${rr(y)})">${pa.svg}</g>`; y+=pa.h+16; });
  const ax=axis(left,tw,L,y+4,sc); body+=ax.svg; y+=ax.h+16;
  const n1=tblock(20,y,`Scale: the horizontal extent of every loop, tail and span is proportional to residue count on the shared axis (1 aa = ${rr(sc)} px). Membrane thickness, loop height and path shape are schematic, not physical distances or a 3D fold.`,12.5,400,'#374151',W-40);
  const n2=tblock(20,y+n1.h+2,`Inside/outside are model-defined sides of a membrane. ${org(p).kind==='phage'?'For a phage protein the relevant host membrane is not assigned. ':''}Signal peptides use precursor numbering; cleavage is predicted, not demonstrated.${anyKey?' Where direct labels would collide, segments are listed in a key.':''}`,12.5,400,'#374151',W-40);
  const H=y+n1.h+n2.h+10;
  return svgOpen(W,H,`${pname(p)} membrane orientation`)+`<defs><pattern id="sphatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbcfe8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#db2777" stroke-width="3"/></pattern></defs>`+head1.svg+head2.svg+body+n1.svg+n2.svg+'</svg>'; }
function panelHead(m,W,right){ const isC=COMP.includes(m); const nameW=textW(m,21,700)+(isC?textW(' (TOPCONS2 component)',13,400):0);
  const s=`<text class="t" x="20" y="24" font-size="21" font-weight="700" fill="#13263b">${esc(m)}${isC?'<tspan font-size="13" font-weight="400" fill="#5b6470"> (TOPCONS2 component)</tspan>':''}</text>`;

function legendRight(){ const t1='outside (non-cytoplasmic)', t2='inside (cytoplasmic)', w1=textW(t1,13,600), w2=textW(t2,13,600);
  return {w:18+w1+22+18+w2, svg:(x,y)=>`<rect x="${rr(x)}" y="${y-11}" width="13" height="13" rx="3" fill="#fff4e0" stroke="#d97706"/><text class="t" x="${rr(x+18)}" y="${y}" font-size="13" font-weight="600" fill="#9a4d03">${t1}</text><rect x="${rr(x+18+w1+22)}" y="${y-11}" width="13" height="13" rx="3" fill="#e2f4f1" stroke="#0f8b80"/><text class="t" x="${rr(x+18+w1+40)}" y="${y}" font-size="13" font-weight="600" fill="#0b6b62">${t2}</text>`}; }
function msgRight(msg){ const w=textW(msg,15,600); return {w, svg:(x,y)=>`<text class="t" x="${rr(x)}" y="${y}" font-size="15" font-weight="600" fill="#374151">${esc(msg)}</text>`}; }
function orientationPanel(p,m,left,tw,sc,W){

    if(a>=0&&b>=0){ regMode=mode; upN=a; dnN=b; up.concat(dn).forEach(it=>{it.r.x0=it.x0; it.r.lane=it.lane; it.r.text=it.r[mode];}); break; } }
  let tmMode=null;
  for(const mode of ['full','short']){ const ws=tms.map(t=>textW(t[mode],13,700)+14); let ok=true;
    for(let i=0;i<tms.length;i++){ const a0=tms[i].cx-ws[i]/2, a1=tms[i].cx+ws[i]/2; if(a0<minX||a1>maxX) ok=false; if(i>0&&a0<tms[i-1].cx+ws[i-1]/2+6) ok=false; }

  rows.forEach((rw,ri)=>{ curRow=ri; mTop=rowTop(ri)+outH; mBot=mTop+memH; col=0;
    rw.forEach((g,k)=>{ const gi=body.indexOf(g), pl=[]; for(let q=g.start;q<=g.stop;q++) pl.push(q);

    spB.forEach((q,i)=>s+=beadSvg(spX0+i*sp,spY,seq[q-1],q,'S',m));
    s+=`<text class="t" x="30" y="${rr(spBottom?spY+36:spY-22)}" font-size="13" font-weight="600" fill="#9d174d">${esc(spLabel)}</text>`;
    s+=badge(spX0-28,spY,'N',12); }
  beads.forEach(b=>{ if(b.gap){ const n=b.gap[1]-b.gap[0]+1; s+=`<g class="gap"><title>Omitted in this view: residues ${b.gap[0]}–${b.gap[1]} (${n} aa); all are shown in the full sequence map</title><rect x="${rr(b.x-r-4)}" y="${rr(b.y-r)}" width="${BEAD.d+8}" height="${BEAD.d}" rx="10" fill="#fff" stroke="#111827" stroke-width="1.4" stroke-dasharray="3 2"/><text class="r" x="${rr(b.x)}" y="${rr(b.y+5)}" font-size="14" font-weight="700" text-anchor="middle">…</text></g>`; } else s+=beadSvg(b.x,b.y,seq[b.pos-1],b.pos,b.state,m); });

  if(rows.length>1){ const b=tblock(30,y,`The chain wraps onto ${rows.length} membrane rows after every ${BEAD_ROW_TMS} spans; “→” marks where it continues (residue ${beads.find(b=>b.row===1).pos} starts row 2${rows.length>2?', and so on':''}). No residues are omitted by wrapping.`,13,600,'#111827',W-60); s+=b.svg; y+=b.h+4; }

function simpleMsg(title,msg){ const b=tblock(20,64,msg,15,400,'#b91c1c',720); return svgOpen(760,80+b.h,title)+`<text class="t" x="20" y="34" font-size="18" font-weight="700">${esc(title)}</text>`+b.svg+'</svg>'; }

// ======================= region table =======================
function regionTable(p,m){ ex(p); const pr=p.pred[m]; if(!pr) return '<p class="note">No prediction.</p>';
  const rows=pr.segments.map(g=>{ const sub=p.sequence.slice(g.start-1,g.stop), n=sub.length, cnt=c=>[...sub].filter(a=>c.includes(a)).length, kr=cnt('KR'), de=cnt('DE'), h=cnt('H'), hy=cnt('AVILMFWY');
    return `<tr><td><span class="sw" style="background:${ST_COL[g.label]}"></span>${esc(ST_NAME[g.label])}</td><td>${g.start}–${g.stop}</td><td>${n}</td><td>${kr}</td><td>${(kr/n).toFixed(3)}</td><td>${de}</td><td>${(de/n).toFixed(3)}</td><td>${h}</td><td>${(hy/n).toFixed(2)}</td></tr>`; }).join('');
  let pi=''; if(pr.spans.length&&pr.spans.every(s=>s[2]==='M')){ const agg=lab=>{ let n=0,kr=0; pr.segments.filter(g=>g.label===lab).forEach(g=>{const sub=p.sequence.slice(g.start-1,g.stop); n+=sub.length; kr+=[...sub].filter(a=>a==='K'||a==='R').length;}); return {n,kr}; }; const I=agg('I'), O=agg('O');
    pi=`<p class="note">Positive-inside context (${esc(m)}): inside-assigned regions ${I.kr} K/R in ${I.n} aa (${I.n?(I.kr/I.n).toFixed(3):'–'} per residue); outside-assigned regions ${O.kr} K/R in ${O.n} aa (${O.n?(O.kr/O.n).toFixed(3):'–'} per residue). A tendency in helical membrane proteins, not evidence for this protein's orientation; long globular domains dilute densities.</p>`; }
  return `<table><thead><tr><th>${esc(m)} region</th><th>Range</th><th>Length</th><th>K+R</th><th>K+R / aa</th><th>D+E</th><th>D+E / aa</th><th>H</th><th>Hydrophobic/aromatic fraction</th></tr></thead><tbody>${rows}</tbody></table><p class="small">Native ${esc(m)} labels: <code>${esc(pr.nseg)}</code></p>${pi}`; }

// ======================= export =======================
function fname(p,method,fig,range){ return safe(`${p.org}_${p.locus_tag||p.protein_id}_${pname(p)}_${method}_${fig}_${range?range[0]+'-'+range[1]:'1-'+p.length}`); }
function download(name,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function svgBlob(svg){ return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+svg],{type:'image/svg+xml'}); }
const MAX_SIDE=16000, MAX_AREA=120e6;
function svgToPng(svg,scale){ return new Promise((res,rej)=>{ const m=svg.match(/width="(\d+(?:\.\d+)?)" height="(\d+(?:\.\d+)?)"/), w=+m[1], h=+m[2]; let sc=scale;
  while(sc>0.25&&(w*sc>MAX_SIDE||h*sc>MAX_SIDE||w*h*sc*sc>MAX_AREA)) sc/=1.25;
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res({blob:b,scale:sc,w:c.width,h:c.height}):rej(new Error('canvas toBlob failed')),'image/png'); };
  img.onerror=()=>rej(new Error('SVG rasterization failed')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }); }
async function copyImage(svg,name){ try{ if(!navigator.clipboard||!window.ClipboardItem) throw 0; const r=await svgToPng(svg,2); await navigator.clipboard.write([new ClipboardItem({'image/png':r.blob})]); toast('Image copied to clipboard'); }catch(e){ const r=await svgToPng(svg,2); download(name+'.png',r.blob); toast('Clipboard unavailable — downloaded PNG instead'); } }
function copyText(t,what){ (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast((what||'Text')+' copied')).catch(()=>{ download((what||'text').toLowerCase().replace(/\W+/g,'_')+'.txt',new Blob([t],{type:'text/plain'})); toast('Clipboard unavailable — downloaded instead'); }); }
function figBlock(id,title,svg,caption,extraBar){ return `<div class="card" id="${id}"><h3>${title}</h3><div class="figbar">${extraBar||''}<span class="sp"></span><button data-act="svg">SVG</button><button data-act="png2">PNG 2×</button><button data-act="png4">PNG 4×</button><button data-act="copy">Copy image</button><button data-act="cap">Copy caption</button><label class="small"><input type="checkbox" data-act="fit" ${state.fit[id]?'checked':''}> fit width</label></div><div class="figwrap ${state.fit[id]?'fit':''}">${svg}</div><div class="caption">${esc(caption)}</div></div>`; }
function wireFig(id,getSvg,caption,name){ const el=$(id); if(!el) return; el.querySelectorAll('.figbar [data-act]').forEach(b=>{ const act=b.dataset.act;
  if(act==='fit'){ b.onchange=()=>{state.fit[id]=b.checked; el.querySelector('.figwrap').classList.toggle('fit',b.checked);}; return; }
  b.onclick=async()=>{ const svg=getSvg(); try{ if(act==='svg') download(name+'.svg',svgBlob(svg));
    if(act==='png2'||act==='png4'){ const want=act==='png2'?2:4, r=await svgToPng(svg,want); download(name+'.png',r.blob); if(r.scale<want) toast(`PNG reduced to ${r.scale.toFixed(2)}× (${r.w}×${r.h}) for browser canvas limits; the SVG keeps full detail`); }
    if(act==='copy') await copyImage(svg,name); if(act==='cap') copyText(caption,'Caption'); }catch(e){ toast('Export failed: '+e.message); } }; }); }

// ======================= one-click re-run =======================

    <form method="post" action="https://phobius.sbc.su.se/predict" enctype="multipart/form-data" target="_blank"><textarea name="protseq" hidden>${esc(fa)}</textarea><input type="hidden" name="format" value="plp"><button class="primary" ${elig('Phobius')?'':'disabled title="sequence not supported by Phobius"'}>Phobius ↗</button></form>

   <p class="note">Phobius and DeepTMHMM: one click submits this exact sequence to the official server in a new tab (the DTU DeepTMHMM server may run a different version from the BioLib app used here: ${esc(DATA.deeptmhmm_versions||'')}). TOPCONS2's form requires a session token, so its button copies the FASTA and opens the form for pasting. Pipeline re-run: on GitHub choose <b>Run workflow</b> with organism <code>${esc(p.org)}</code> and protein <code>${esc(p.protein_id)}</code>; it records a new, separately named batch, keeps the earlier result as superseded, and rebuilds the atlas.</p>

// ======================= sidebar & selection =======================
function searchText(p){ return [p.protein_id,p.gene,p.locus_tag,p.protein_accession,p.product,p.curator_alias,p.note,...(p.synonyms||[]),org(p).name,p.org].join(' ').toLowerCase(); }

function applyFilters(){ const q=$('q').value.trim().toLowerCase(), f={}; document.querySelectorAll('#filters input').forEach(i=>f[i.dataset.f]=i.checked);
  state.filtered=P.map((p,i)=>i).filter(i=>{ const p=P[i];
    if(state.org!=='*'&&p.org!==state.org) return false; if(q&&!q.split(/\s+/).every(t=>STX[i].includes(t))) return false;
    if(f.span&&!p.any_membrane_span) return false; if(f.sp&&!p.any_signal_peptide) return false; if(f.beta&&!hasBeta(p)) return false;
    if(f.dis&&!p.disagreements.length) return false; if(f.flag&&!(p.annotation_flags.length||p.ineligible)) return false; if(f.inc&&!incomplete(p)) return false; return true; });
  state.shown=200; renderList(); }
function renderList(){ const items=state.filtered.slice(0,state.shown), multi=ORDER.length>1;
  $('plist').innerHTML=items.map(i=>{ const p=P[i]; const tags=(p.any_membrane_span?'<span class="tag tm">TM</span>':'')+(p.any_signal_peptide?'<span class="tag sp">SP</span>':'')+(hasBeta(p)?'<span class="tag beta">β</span>':'')+(p.disagreements.length?'<span class="tag dis">disagree</span>':'')+(incomplete(p)?'<span class="tag inc">incomplete</span>':'')+(p.annotation_flags.length||p.ineligible?'<span class="tag flag">flag</span>':'');
    return `<li data-i="${i}" class="${i===state.idx?'sel':''}">${multi&&state.org==='*'?`<div class="org">${esc(org(p).name)}</div>`:''}<b>${esc(pname(p))}</b> ${tags}<div class="pm">${esc(p.locus_tag)} · ${p.length} aa · ${esc(p.product)}</div></li>`; }).join('');
  $('cnt').textContent=`${state.filtered.length.toLocaleString()} of ${P.length.toLocaleString()} proteins match`;
  $('more').style.display=state.filtered.length>state.shown?'block':'none';
  const opts=state.filtered.slice(0,2000); $('dd').innerHTML=opts.map(i=>`<option value="${i}" ${i===state.idx?'selected':''}>${esc(pname(P[i]))} — ${esc(P[i].locus_tag)} (${P[i].length} aa)${multi&&state.org==='*'?' · '+esc(P[i].org):''}</option>`).join('')+(state.filtered.length>2000?`<option disabled>… ${(state.filtered.length-2000).toLocaleString()} more — refine the search</option>`:''); }
$('plist').addEventListener('click',e=>{const li=e.target.closest('li'); if(li) select(+li.dataset.i);});
$('dd').addEventListener('change',e=>select(+e.target.value)); $('more').onclick=()=>{state.shown+=200; renderList();};
$('q').addEventListener('input',applyFilters); document.querySelectorAll('#filters input').forEach(i=>i.addEventListener('change',applyFilters));
function step(d){ const Lf=state.filtered; if(!Lf.length) return; let k=Lf.indexOf(state.idx); k=k<0?0:(k+d+Lf.length)%Lf.length; select(Lf[k]); }
$('prev').onclick=()=>step(-1); $('next').onclick=()=>step(1);
document.querySelectorAll('#maintabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#maintabs button').forEach(x=>x.classList.toggle('on',x===b)); $('tab-protein').style.display=b.dataset.tab==='protein'?'':'none'; $('tab-about').style.display=b.dataset.tab==='about'?'':'none'; if(b.dataset.tab==='about') renderAbout(); });
$('orgsel').innerHTML=(ORDER.length>1?`<option value="*">All organisms (${ORDER.length})</option>`:'')+['phage','host'].map(k=>{ const ks=ORDER.filter(o=>ORGS[o].kind===k); return ks.length?`<optgroup label="${k==='phage'?'Model phages':'Model hosts'}">${ks.map(o=>`<option value="${o}">${esc(ORGS[o].name)} (${ORGS[o].n.toLocaleString()})</option>`).join('')}</optgroup>`:''; }).join('');
$('orgsel').onchange=e=>{ state.org=e.target.value; applyFilters(); if(state.filtered.length) select(state.filtered[0]); if($('tab-about').style.display!=='none') renderAbout(); };
function select(i){ state.idx=i; state.win=null; const p=ex(P[i]), avail=ALLM.filter(m=>p.status[m]==='complete');
  if(!avail.includes(state.beadModel)) state.beadModel=avail[0]||null; if(!avail.includes(state.mapModel)) state.mapModel=null;
  try{history.replaceState(null,'','#'+encodeURIComponent(p.protein_id));}catch(e){} renderList(); renderProtein(); }

// ======================= protein view =======================
function sel(){ return ALLM.filter(m=>state.methods.has(m)); }
function renderProtein(){ const p=ex(P[state.idx]), o=org(p), el=$('tab-protein'), ms=sel(), used=ms.filter(m=>p.pred[m]);
  const statusRows=ALLM.map(m=>{ const st=p.status[m]||'not run', pr=p.pred[m], base=COMP.includes(m)?'TOPCONS2':m;
    const ext=pr?`${pr.spans.length?pr.spans.map(s=>`${s[0]}–${s[1]}${s[2]==='B'?' (β)':''}`).join(', '):'no span'}${pr.sp_range?` · SP ${pr.sp_range[0]}–${pr.sp_range[1]}`:''}`:(p.ineligible&&p.ineligible[base]?esc(p.ineligible[base]):'');
    const tm=p.topcons_meta, src=pr?`<span class="small">${esc(pr.src||'')} · batch ${esc(pr.batch)}${base==='TOPCONS2'&&tm?` · ${esc(tm.cache||'')} result generated ${esc(tm.generated||'?')}`:''}${p.superseded&&p.superseded[m]?` · supersedes ${p.superseded[m].map(x=>esc(x.batch)).join(', ')}`:''}</span>`:'';
    return `<tr><td>${COMP.includes(m)?'&nbsp;&nbsp;↳ ':''}<b>${esc(m)}</b></td><td class="st-${esc(st)}">${esc(st.replace(/_/g,' '))}</td><td>${ext}</td><td>${pr&&pr.cls?esc(pr.cls):''}</td><td>${src}</td></tr>`; }).join('');
  const notes=ALLM.flatMap(m=>(p.pred[m]&&p.pred[m].notes||[]).map(n=>`<li><b>${esc(m)}:</b> ${esc(n)}</li>`));
  const dis=p.disagreements.length?`<div class="warnbox"><b>Main-method disagreement:</b> ${p.disagreements.map(esc).join('; ')}. Methods are shown side by side; no consensus is imposed.</div>`:'';
  const inc=MAIN.filter(m=>p.status[m]!=='complete'), incBox=inc.length?`<div class="badbox"><b>Missing data:</b> ${inc.map(m=>`${esc(m)} (${esc((p.status[m]||'not run').replace(/_/g,' '))})`).join(', ')}. Figures omit unavailable methods; nothing is substituted.</div>`:'';
  const mt=m=>`<label><input type="checkbox" data-m="${esc(m)}" ${state.methods.has(m)?'checked':''} ${p.status[m]==='complete'?'':'disabled'}> ${esc(m)}</label>`;
  const avail=ALLM.filter(m=>p.status[m]==='complete'), regM=avail.includes(state.mapModel)?state.mapModel:avail[0], range=state.win;
  el.innerHTML=`<div class="card"><h2>${esc(pname(p))} <span class="note" style="font-weight:400">· ${esc(p.product)}</span></h2>
    <div class="meta"><div><span>Organism:</span> ${esc(o.name)}</div><div><span>Protein ID:</span> ${esc(p.protein_id)}</div><div><span>Locus tag:</span> ${esc(p.locus_tag)}</div>
      <div><span>Gene (record):</span> ${esc(p.gene||'— (no /gene qualifier)')}</div><div><span>Curator alias:</span> ${esc(p.curator_alias||'—')} ${p.curator_alias?'<span class="note">(not in source record)</span>':''}</div>
      <div><span>Protein accession:</span> ${esc(p.protein_accession)}</div><div><span>Replicon:</span> ${esc(p.replicon)} · ${esc(p.location)} (${esc(p.strand)})</div>
      <div><span>Length:</span> ${p.length} aa</div><div><span>Genetic code:</span> table ${esc(p.transl_table||11)}</div>
      <div><span>Annotation flags:</span> ${p.annotation_flags.length?p.annotation_flags.map(esc).join(', '):'none'}</div>
      <div><span>Synonyms / note:</span> ${esc([...(p.synonyms||[]),p.note].filter(Boolean).join('; ')||'—')}</div>
      ${p.identical_sequence_to&&p.identical_sequence_to.length?`<div><span>Identical sequence to:</span> ${p.identical_sequence_to.map(esc).join(', ')}</div>`:''}</div>
    <p class="small" style="margin:8px 0 4px">SHA-256: <code>${p.sequence_sha256}</code></p><div class="seqbox">${esc(p.sequence)}</div>
    <div class="figbar"><button id="dlfa">Download FASTA</button><button id="dljson">Download protein JSON</button><button id="dlorg">Download organism dataset (JSON)</button><button id="dlcsv">Download organism summary (CSV)</button></div></div>
  ${rerunCard(p)}
  <div class="card"><h3>Prediction status &amp; segment calls</h3>${dis}${incBox}<table><thead><tr><th>Method</th><th>Status</th><th>Membrane spans / signal peptide</th><th>Native classification</th><th>Source</th></tr></thead><tbody>${statusRows}</tbody></table>
    ${notes.length?`<ul class="small">${notes.join('')}</ul>`:''}<p class="note">TOPCONS2 components contribute to the TOPCONS2 consensus; they are not independent votes in addition to it.</p></div>
  <div class="card"><h3>Methods shown in figures</h3><div class="toggles"><fieldset><legend>Main methods</legend>${MAIN.map(mt).join(' ')}</fieldset><fieldset><legend>TOPCONS2 components (optional)</legend>${COMP.map(mt).join(' ')}</fieldset><label><input type="checkbox" id="hydt" ${state.hyd?'checked':''}> highlight hydrophobic/aromatic class</label></div></div>
  <div id="figs"></div>
  <div class="card"><h3>Segment boundaries &amp; charge by region</h3><div class="figbar"><label>Model: <select id="regm" style="width:auto">${avail.map(m=>`<option ${m===regM?'selected':''}>${esc(m)}</option>`).join('')}</select></label></div><div id="regtab">${regM?regionTable(p,regM):'<p class="note">No completed predictions.</p>'}</div></div>
  <div class="card"><h3>Server-provided plots (raw)</h3><div id="rawplots"></div></div>`;
  const capBase=`${o.name} (${p.replicon}), ${pname(p)} [${p.locus_tag}; ${p.protein_accession}], ${p.length} aa. 1-based inclusive numbering of the annotated precursor translation.`;
  const capA=`Predicted membrane orientation of ${capBase} Methods: ${ms.join(', ')||'none'}. Horizontal extents are proportional to residue count on a shared axis; membrane thickness and loop geometry are schematic. Computational predictions, not experimental evidence.`;
  const capD=`Linear comparison of predicted topology for ${capBase} Methods: ${ms.join(', ')||'none'}. Tracks show categorical one-best state assignments on the same full-length axis. Computational predictions.`;
  const capB=`Sequence and approximate side-chain charge classes for ${capBase} Residues ${range?range[0]+'–'+range[1]:'1–'+p.length}. K/R generally positive, D/E generally negative, H variable; approximate classes near neutral pH, not measured charges. Topology bands: ${used.join(', ')||'none'} (predictions).`;
  const bead=state.beadModel?figBeads(p,state.beadModel):{svg:simpleMsg('Residue-bead view','No completed prediction for this protein.')};
  const capC=`Residue-bead membrane cartoon for ${capBase} Model: ${state.beadModel||'none'}. Residues placed by the model's per-residue states; loop packing is schematic and not a predicted fold${bead.accounting&&bead.accounting.gaps&&bead.accounting.gaps.length?`; residues ${bead.accounting.gaps.map(g=>g[0]+'–'+g[1]).join(', ')} are abbreviated here and shown in full in the sequence map`:''}. Charge colours are approximate side-chain classes. Computational prediction.`;
  const tag=ms.join('+')||'none', nA=fname(p,tag,'orientation'), nD=fname(p,tag,'tracks'), nB=fname(p,tag,'seqcharge',range), nC=fname(p,state.beadModel||'none','beads');
  const winBar=`<label class="small">Row length <select id="rowlen" style="width:auto">${[30,40,50,60,80,100].map(v=>`<option ${v===state.rowLen?'selected':''}>${v}</option>`).join('')}</select></label> <label class="small">Window <input id="w0" type="number" min="1" max="${p.length}" value="${range?range[0]:1}" style="width:70px"> – <input id="w1" type="number" min="1" max="${p.length}" value="${range?range[1]:p.length}" style="width:70px"></label> <button id="wapply">Apply window</button> <button id="wfull">Full length</button>`;
  const beadBar=`<label class="small">Model <select id="beadm" style="width:auto">${avail.map(m=>`<option ${m===state.beadModel?'selected':''}>${esc(m)}</option>`).join('')}</select></label>`;
  $('figs').innerHTML=figBlock('figA','A · Membrane orientation',figOrientation(p,ms),capA)+figBlock('figB','B · Full-length sequence &amp; charge map'+(range?` <span class="note">(window ${range[0]}–${range[1]})</span>`:''),figSeqMap(p,used,range),capB,winBar)+figBlock('figC','C · Residue-bead membrane cartoon',bead.svg,capC,beadBar)+figBlock('figD','D · Linear method-comparison tracks',figTracks(p,ms),capD);
  wireFig('figA',()=>figOrientation(p,sel()),capA,nA); wireFig('figB',()=>figSeqMap(p,sel().filter(m=>p.pred[m]),state.win),capB,nB); wireFig('figC',()=>figBeads(p,state.beadModel).svg,capC,nC); wireFig('figD',()=>figTracks(p,sel()),capD,nD);
  el.querySelectorAll('[data-m]').forEach(cb=>cb.onchange=()=>{ cb.checked?state.methods.add(cb.dataset.m):state.methods.delete(cb.dataset.m); renderProtein(); });
  $('hydt').onchange=e=>{state.hyd=e.target.checked; savePrefs(); renderProtein();};
  const bm=$('beadm'); if(bm) bm.onchange=e=>{state.beadModel=e.target.value; renderProtein();};
  $('rowlen').onchange=e=>{state.rowLen=+e.target.value; savePrefs(); renderProtein();};
  $('wapply').onclick=()=>{ let a=Math.max(1,Math.min(p.length,+$('w0').value||1)), b=Math.max(1,Math.min(p.length,+$('w1').value||p.length)); if(a>b)[a,b]=[b,a]; state.win=(a===1&&b===p.length)?null:[a,b]; renderProtein(); };
  $('wfull').onclick=()=>{state.win=null; renderProtein();};
  const rm=$('regm'); if(rm) rm.onchange=e=>{state.mapModel=e.target.value; $('regtab').innerHTML=regionTable(p,e.target.value);};
  $('tcbtn').onclick=()=>{ copyText(fastaOf(p),'FASTA'); window.open('https://topcons.net/pred/','_blank','noopener'); };
  $('cmdbtn').onclick=()=>copyText(rerunCmd(p),'Command');
  const strip=(k,v)=>k==='_x'||k==='labels'||k==='segments'?undefined:v;
  $('dlfa').onclick=()=>download(safe(`${p.org}_${p.locus_tag}_${pname(p)}`)+'.fasta',new Blob([fastaOf(p)],{type:'text/plain'}));
  $('dljson').onclick=()=>download(safe(`${p.org}_${p.locus_tag}_${pname(p)}`)+'.json',new Blob([JSON.stringify(p,strip,1)],{type:'application/json'}));
  $('dlorg').onclick=()=>download(safe(`${p.org}_topology_dataset`)+'.json',new Blob([JSON.stringify({organism:o,segment_encoding:DATA.segment_encoding,state_definitions:DATA.state_definitions,proteins:P.filter(q=>q.org===p.org)},strip)],{type:'application/json'}));
  $('dlcsv').onclick=()=>download(safe(`${p.org}_topology_summary`)+'.csv',new Blob([summaryCsv(p.org)],{type:'text/csv'}));
  const plot=p.pred.Phobius&&p.pred.Phobius.plot;
  $('rawplots').innerHTML = plot ? `<p class="small"><b>Phobius posterior-probability plot</b> returned by the server (<code>${esc(o.base+plot)}</code>; displays when the atlas sits next to its organism folders).</p><img class="rawplot" alt="Phobius posterior plot" src="${esc(o.base+plot)}">` : `<p class="note">${o.kind==='host'?'Per-protein server plots were not requested for proteome-scale batches; all raw text outputs are in the organism folder.':'No server-provided plot for this protein.'}</p>`;
  const img=$('rawplots').querySelector('img'); if(img) img.onerror=()=>{ img.replaceWith(Object.assign(document.createElement('p'),{className:'note',textContent:'Plot file not found next to this atlas; it is in the organism folder at '+o.base+plot})); }; }
function summaryCsv(key){ const cols=['protein_id','gene','curator_alias','locus_tag','protein_accession','product','length','sequence_sha256'], q=v=>{v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  let out=[...cols,...ALLM.flatMap(m=>[m+'_status',m+'_spans',m+'_signal_peptide',m+'_segments']),'disagreements'].join(',')+'\n';
  P.filter(p=>p.org===key).forEach(p=>{ out+=[...cols.map(c=>q(p[c])),...ALLM.flatMap(m=>{const pr=p.pred[m]; return [q(p.status[m]),q(pr?pr.spans.map(s=>s[0]+'-'+s[1]+(s[2]==='B'?'(beta)':'')).join(';'):''),q(pr?(pr.sp_range?pr.sp_range.join('-'):'none'):''),q(pr?pr.seg:'')];}),q(p.disagreements.join(';'))].join(',')+'\n'; }); return out; }

// ======================= about tab =======================
function renderAbout(){ const keys=state.org==='*'?ORDER:[state.org], wf=`https://github.com/${REPO}/actions/workflows/${WF}`;
  const ov=ORDER.map(k=>{ const o=ORGS[k]; return `<tr><td>${esc(o.name)}</td><td>${esc(o.kind)}</td><td>${esc(o.accession)}</td><td>${o.n.toLocaleString()}</td>${MAIN.map(m=>`<td>${o.coverage[m].complete.toLocaleString()} / ${o.coverage[m].eligible.toLocaleString()}${o.coverage[m].eligible<o.n?` <span class="note">(${o.n-o.coverage[m].eligible} ineligible)</span>`:''}</td>`).join('')}<td>${o.n_span.toLocaleString()}</td><td>${o.n_sp.toLocaleString()}</td><td>${o.n_beta.toLocaleString()}</td></tr>`; }).join('');
  const per=keys.map(k=>{ const o=ORGS[k], ip=o.input_provenance;
    const cov=ALLM.map(m=>{const c=o.coverage[m]; return `<tr><td>${COMP.includes(m)?'&nbsp;&nbsp;↳ ':''}${esc(m)}</td><td>${c.complete} / ${c.eligible}</td><td>${c.complete} / ${c.inventory}</td><td class="small">${esc(Object.entries(c.status_counts).map(([a,b])=>a+': '+b).join(', '))}</td></tr>`;}).join('');
    const jobs=Object.entries(o.jobs).map(([m,js])=>js.map(j=>`<tr><td>${esc(m)}</td><td>${esc(j.batch||'')}${j.format?' ('+esc(j.format)+')':''}${j.rerun?' · re-run':''}</td><td class="small">${esc(j.jobid||j.job_id||'—')}</td><td>${esc(j.status)}</td><td class="small">${esc(j.submitted_utc||'')}</td><td>${esc(j.n_sequences??'')}</td></tr>`).join('')).join('');
    const allDone=MAIN.every(m=>o.coverage[m].complete===o.coverage[m].eligible);
    return `<div class="card"><h2>${esc(o.name)}</h2><p>RefSeq ${ip.ncbi_summaries.map(s=>`<b>${esc(s.accessionversion)}</b> (${esc(s.title)}; ${s.slen.toLocaleString()} nt, ${esc(s.topology)}; NCBI update ${esc(s.updatedate)})`).join('; ')}. ${esc(o.host_note)}</p>
     <p>Scope: all ${o.n.toLocaleString()} CDS features with a <code>/translation</code> (${o.n_cds.toLocaleString()} CDS features; ${o.n_pseudo} pseudogenes or untranslated CDSs recorded separately). Sequences are used exactly as annotated.</p>
     ${allDone?'':'<div class="badbox"><b>Partial:</b> at least one main method has not finished for every eligible protein. Missing predictions are shown as pending or failed, never substituted.</div>'}
     <p class="small">Inputs (retrieved ${esc(ip.files[0].retrieved_utc)}): ${ip.files.map(f=>`<code>${esc(f.file)}</code> sha256 <code>${esc(f.sha256.slice(0,16))}…</code>`).join(' · ')}</p>
     <p><a class="btn" href="${wf}" target="_blank" rel="noopener">Re-run this organism ↗ (GitHub Actions)</a> <span class="small">or <code>python3 scripts/rerun.py --org ${esc(k)}</code></span></p>
     <details><summary>Coverage by method</summary><table><thead><tr><th>Method</th><th>Complete / eligible</th><th>Complete / inventory</th><th>Status counts</th></tr></thead><tbody>${cov}</tbody></table></details>
     <details><summary>Submission records (${Object.values(o.jobs).reduce((a,j)=>a+j.length,0)})</summary><table><thead><tr><th>Method</th><th>Batch</th><th>Job ID</th><th>Status</th><th>Submitted (UTC)</th><th>Seqs</th></tr></thead><tbody>${jobs}</tbody></table></details></div>`; }).join('');
  $('tab-about').innerHTML=`<div class="card"><h2>Atlas overview</h2><p>${ORDER.length} organism${ORDER.length>1?'s':''} · ${P.length.toLocaleString()} annotated protein translations · built ${esc(DATA.built_utc)}. All calls are computational predictions, not experimental evidence.</p>
   <table><thead><tr><th>Organism</th><th>Kind</th><th>RefSeq</th><th>Proteins</th>${MAIN.map(m=>`<th>${m} complete / eligible</th>`).join('')}<th>≥1 span</th><th>Signal peptide</th><th>β states</th></tr></thead><tbody>${ov}</tbody></table>
   <p class="note">Eligibility follows each service's documented alphabet and length limits: Phobius accepts the 20 amino acids plus B/Z/X and removes other characters, so selenocysteine (U) proteins are not submitted; DeepTMHMM accepts the 20 standard amino acids; TOPCONS2 requires 10–10,000 aa. Sequences are never altered to make them eligible.</p></div>${per}
  <div class="card"><h3>Methods</h3><ul>
   <li><b>Phobius</b> — HMM combining α-helical TM topology and signal-peptide prediction (phobius.sbc.su.se JSON API). Native labels n/h/c = signal-peptide regions; C = cleavage marker on the first mature residue, mapped to the following region and never counted as signal peptide; i/o/O = inside/outside; M = membrane. Käll, Krogh &amp; Sonnhammer (2004) <a href="https://doi.org/10.1016/j.jmb.2004.03.016">J Mol Biol 338:1027</a>.</li>
   <li><b>DeepTMHMM</b> — deep-learning model for α-helical and β-barrel topology plus signal peptides (BioLib app DTU/DeepTMHMM; ${esc(DATA.deeptmhmm_versions||'')}). States I, O, M, S, B (β membrane), P (periplasm in β-barrel predictions). Hallgren et al. (2022) <a href="https://doi.org/10.1101/2022.04.08.487609">bioRxiv 2022.04.08.487609</a>.</li>
   <li><b>TOPCONS2</b> — consensus of OCTOPUS, Philius, PolyPhobius, SCAMPI and SPOCTOPUS (topcons.net WSDL API). The server may return cached results for identical sequences; each protein's generation date and cache status are shown. Tsirigos et al. (2015) <a href="https://doi.org/10.1093/nar/gkv485">Nucleic Acids Res 43:W401</a>. Components: OCTOPUS (<a href="https://doi.org/10.1093/bioinformatics/btn221">Viklund &amp; Elofsson 2008</a>), Philius (<a href="https://doi.org/10.1371/journal.pcbi.1000213">Reynolds et al. 2008</a>), PolyPhobius (<a href="https://doi.org/10.1093/bioinformatics/bti1014">Käll et al. 2005</a>), SCAMPI (<a href="https://doi.org/10.1110/ps.034470.108">Bernsel et al. 2008</a>), SPOCTOPUS (<a href="https://doi.org/10.1093/bioinformatics/btn550">Viklund et al. 2008</a>).</li></ul>
   <h3>Normalized states</h3><ul>${Object.entries(DATA.state_definitions).map(([k,v])=>`<li><span class="sw" style="background:${ST_COL[k]}"></span><b>${k}</b> — ${esc(v)}</li>`).join('')}</ul>
   <p class="small">${esc(DATA.segment_encoding)}. Coordinates: ${esc(DATA.coordinate_convention)}.</p></div>
  <div class="card"><h3>Reading the figures — cautions</h3><ul>
   <li>Inside/outside labels on a protein with no predicted membrane span do not establish localization.</li>
   <li>A predicted signal peptide is not demonstrated cleavage, lipidation or a permanent anchor; precursor numbering is kept.</li>
   <li>For phages, inside/outside refers to a generic membrane context; no host membrane is assigned and nothing here predicts a viral envelope. For Gram-negative hosts the models do not say which membrane a protein is in.</li>
   <li><b>Positive-inside tendency.</b> In α-helical membrane proteins Lys/Arg are statistically enriched in cytoplasmic loops (von Heijne 1986, <a href="https://doi.org/10.1002/j.1460-2075.1986.tb04655.x">EMBO J 5:3021</a>; 1992, <a href="https://doi.org/10.1016/0022-2836(92)90934-C">J Mol Biol 225:487</a>), and stretches of ~15–25 hydrophobic residues are consistent with membrane-spanning helices (cf. Hessa et al. 2005, <a href="https://doi.org/10.1038/nature03216">Nature 433:377</a>). These are tendencies, not proofs, and do not apply directly to β-barrels; region tables report densities.</li>
   <li>Charge classes are simplified side-chain categories, not measured charges, net charge, pI or electrostatics.</li></ul></div>`; }

// ======================= init =======================
$('ttl').textContent=DATA.title; $('subttl').textContent=`${ORDER.length>1?ORDER.length+' organisms · ':''}${P.length.toLocaleString()} annotated protein translations · predictions, not experimental evidence`;
if(ORDER.length===1){ state.org=ORDER[0]; $('orgsel').style.display='none'; }
applyFilters();
const hh=decodeURIComponent(location.hash.slice(1)), hi=P.findIndex(p=>p.protein_id===hh);
select(hi>=0?hi:(state.filtered[0]??0));
</script>
</body>
</html>
