<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title>gene K method comparison</title><rect width="900" height="340" fill="#ffffff"/><text x="170" y="26" font-size="20" font-weight="700" fill="#1b1f24">gene K — predicted topology by method</text><text x="170" y="46" font-size="13" fill="#5b6470">Escherichia phage phiX174 · phiX174p04 · residues 1–56 (1-based precursor numbering) · categorical one-best assignments, not confidence scores</text><text x="160" y="79" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">Phobius</text><rect x="170" y="67" width="690" height="14" fill="#0d9488" ><title>Phobius: Inside (cytoplasmic side) 1–56 (56 aa)</title></rect><text x="160" y="113" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">DeepTMHMM</text><rect x="170" y="101" width="690" height="14" fill="#0d9488" ><title>DeepTMHMM: Inside (cytoplasmic side) 1–56 (56 aa)</title></rect><text x="160" y="147" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">TOPCONS2</text><rect x="170" y="135" width="690" height="14" fill="#d97706" ><title>TOPCONS2: Outside (non-cytoplasmic) 1–56 (56 aa)</title></rect><text x="160" y="188" font-size="12.5" text-anchor="end" fill="#5b6470">TOPCONS2 reliability</text><text x="160" y="203" font-size="11" text-anchor="end" fill="#5b6470">(tool-provided, 0–1)</text><rect x="170" y="168" width="690" height="44" fill="#fafafa" stroke="#e5e7eb"/><path d="M299.4 168L311.7 168L324 168L336.3 168L348.7 168L361 168L373.3 168L385.6 168L397.9 168L410.3 168L422.6 168L434.9 168L447.2 168L459.6 168L471.9 168L484.2 168L496.5 168L508.8 168L521.2 168L533.5 168L545.8 168L558.1 168L570.4 168L582.8 168L595.1 168L607.4 168L619.7 168L632.1 168L644.4 168L656.7 168L669 168L681.3 168L693.7 168L706 168L718.3 168" fill="none" stroke="#1f4e79" stroke-width="1.6"/><text x="864" y="176" font-size="10" fill="#5b6470">1