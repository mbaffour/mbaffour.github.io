<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="572" viewBox="0 0 1240 572" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title>gene E membrane orientation</title><rect width="1240" height="572" fill="#ffffff"/><defs><pattern id="sphatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbcfe8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#db2777" stroke-width="3"/></pattern></defs><text x="80" y="32" font-size="24" font-weight="800" fill="#14263a">gene E · predicted membrane orientation</text><text x="80" y="54" font-size="14" fill="#5b6470">Escherichia phage phiX174 · endolysin · 91 aa · computational predictions</text><g transform="translate(0,70)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">Phobius</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="391.6" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–33</title></rect><rect x="471.6" y="50" width="688.4" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 34–91</title></rect><line x1="275.8" y1="74" x2="275.8" y2="86" stroke="#94a3b8"/><text x="249.6" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–33</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><g transform="translate(0,218)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">DeepTMHMM</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="308.6" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–26</title></rect><rect x="388.6" y="50" width="771.4" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 27–91</title></rect><line x1="234.3" y1="74" x2="234.3" y2="86" stroke="#94a3b8"/><text x="208.2" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–26</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><g transform="translate(0,366)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">TOPCONS2</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="356" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–30</title></rect><rect x="436" y="50" width="724" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 31–91</title></rect><line x1="258" y1="74" x2="258" y2="86" stroke="#94a3b8"/><text x="231.7" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–30</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><text x="80" y="524" font-size="12.5" fill="#374151">Scale: horizontal extent of every loop, tail and span ∝ residue count on one shared axis (1 aa = 11.9 px). Membrane depth, loop height and path shape are schematic, not physical distances or a 3D fold.</text><text x="80" y="542" font-size="12.5" fill="#374151">Inside/outside are model-defined sides of a membrane; for a phage protein the relevant host membrane is not assigned here. Signal peptides use precursor numbering; cleavage is predicted, not demonstrated.</text></svg>