<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title>gene J method comparison</title><rect width="900" height="340" fill="#ffffff"/><text x="170" y="26" font-size="20" font-weight="700" fill="#1b1f24">gene J — predicted topology by method</text><text x="170" y="46" font-size="13" fill="#5b6470">Escherichia phage phiX174 · phiX174p09 · residues 1–38 (1-based precursor numbering) · categorical one-best assignments, not confidence scores</text><text x="160" y="79" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">Phobius</text><rect x="170" y="67" width="690" height="14" fill="#0d9488" ><title>Phobius: Inside (cytoplasmic side) 1–38 (38 aa)</title></rect><text x="160" y="113" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">DeepTMHMM</text><rect x="170" y="101" width="690" height="14" fill="#0d9488" ><title>DeepTMHMM: Inside (cytoplasmic side) 1–38 (38 aa)</title></rect><text x="160" y="147" font-size="15" font-weight="700" text-anchor="end" fill="#1b1f24">TOPCONS2</text><rect x="170" y="135" width="690" height="14" fill="#d97706" ><title>TOPCONS2: Outside (non-cytoplasmic) 1–38 (38 aa)</title></rect><text x="160" y="188" font-size="12.5" text-anchor="end" fill="#5b6470">TOPCONS2 reliability</text><text x="160" y="203" font-size="11" text-anchor="end" fill="#5b6470">(tool-provided, 0–1)</text><rect x="170" y="168" width="690" height="44" fill="#fafafa" stroke="#e5e7eb"/><path d="M360.7 168L378.8 168L397 168L415.1 168L433.3 168L451.4 168L469.6 168L487.8 168L505.9 168L524.1 168L542.2 168L560.4 168L578.6 168L596.7 168L614.9 168L633 168L651.2 168" fill="none" stroke="#1f4e79" stroke-width="1.6"/><text x="864" y="176" font-size="10" fill="#5b6470">1</text><text x="864" y="212" font-size="10" fill="#5b6470">0</text><text x="170" y="226" font-size="11" fill="#5b6470">Reliability reported by TOPCONS2 for positions 11–27 only