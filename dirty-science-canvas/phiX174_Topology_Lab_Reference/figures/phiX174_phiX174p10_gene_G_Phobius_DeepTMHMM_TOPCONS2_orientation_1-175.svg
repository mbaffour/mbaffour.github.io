<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="536" viewBox="0 0 1240 536" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title>gene G membrane orientation</title><rect width="1240" height="536" fill="#ffffff"/><defs><pattern id="sphatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbcfe8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#db2777" stroke-width="3"/></pattern></defs><text x="80" y="32" font-size="24" font-weight="800" fill="#14263a">gene G · predicted membrane orientation</text><text x="80" y="54" font-size="14" fill="#5b6470">Escherichia phage phiX174 · major spike protein · 175 aa · computational predictions</text><g transform="translate(0,70)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">Phobius</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted</text><rect x="80" y="50" width="1080" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 1–175</title></rect><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="98" font-size="12.5" fill="#5b6470">Model reports "outside" labels for this chain; without a membrane span these labels do not establish localization.</text></g><g transform="translate(0,200)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">DeepTMHMM</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted · signal peptide predicted (precursor)</text><rect x="80" y="50" width="185.1" height="24" rx="3" fill="url(#sphatch)" stroke="#db2777"><title>Signal peptide (precursor) 1–30</title></rect><rect x="265.1" y="50" width="894.9" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 31–175</title></rect><line x1="172.6" y1="74" x2="172.6" y2="86" stroke="#94a3b8"/><text x="146.2" y="98" font-size="14" font-weight="600" fill="#db2777">SP 1–30</text><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="122" font-size="12.5" fill="#5b6470"></text></g><g transform="translate(0,348)"><text x="20" y="25" font-size="21" font-weight="800" fill="#14263a">TOPCONS2</text><text x="1160" y="26" font-size="17" font-weight="700" text-anchor="end" fill="#374151">no membrane span predicted</text><rect x="80" y="50" width="1080" height="24" rx="3" fill="#cbd5e1" stroke="none"><title>Outside (non-cytoplasmic) 1–175</title></rect><circle cx="58" cy="62" r="14" fill="#14263a"/><text x="58" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">N</text><circle cx="1182" cy="62" r="14" fill="#14263a"/><text x="1182" y="67.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff">C</text><text x="80" y="98" font-size="12.5" fill="#5b6470">Model reports "outside" labels for this chain; without a membrane span these labels do not establish localization.</text></g><text x="80" y="488" font-size="12.5" fill="#374151">Scale: horizontal extent of every loop, tail and span ∝ residue count on one shared axis (1 aa = 6.2 px). Membrane depth, loop height and path shape are schematic, not physical distances or a 3D fold.</text><text x="80" y="506" font-size="12.5" fill="#374151">Inside/outside are model-defined sides of a membrane; for a phage protein the relevant host membrane is not assigned here. Signal peptides use precursor numbering; cleavage is predicted, not demonstrated.</text></svg>