<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1b1f24; --muted:#5b6470; --line:#d9dce1; --accent:#1f4e79;
  --st-I:#0d9488; --st-O:#d97706; --st-M:#334155; --st-S:#db2777; --st-B:#0891b2; --st-P:#65a30d;
  --pos:#1d4ed8; --neg:#dc2626; --his:#8b5cf6; --hyd:#f3dfb4; --warn:#b45309; --bad:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
header.top{padding:14px 20px;background:#14263a;color:#fff;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
header.top h1{margin:0;font-size:20px;letter-spacing:.2px}
header.top .sub{color:#c8d3df;font-size:13px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 54px)}
aside{border-right:1px solid var(--line);background:#fbfaf7;padding:12px;position:sticky;top:0;height:100vh;overflow:auto}
main{padding:16px 22px 60px;min-width:0}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px 16px 40px}}
input[type=search],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.filters{display:grid;grid-template-columns:1fr;gap:3px;margin:10px 0;font-size:13px}
.filters label{display:flex;gap:6px;align-items:center}
.count{font-size:12px;color:var(--muted);margin:6px 0}
ul.plist{list-style:none;margin:0;padding:0}
ul.plist li{padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:13px}
ul.plist li:hover{background:#eef2f6}
ul.plist li.sel{background:#e3ecf6;border-color:#9fb7d3}
ul.plist .pm{color:var(--muted);font-size:11.5px}
.tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:9px;margin-left:3px;border:1px solid;line-height:16px;vertical-align:1px}
.tag.tm{color:#334155;border-color:#334155}.tag.sp{color:var(--st-S);border-color:var(--st-S)}.tag.dis{color:var(--warn);border-color:var(--warn)}.tag.inc{color:var(--bad);border-color:var(--bad)}.tag.flag{color:#6b21a8;border-color:#6b21a8}
.nav{display:flex;gap:6px;margin:8px 0}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid #b9c0c9;background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
button:hover{background:#eef2f6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 16px}
.card h2{margin:0 0 6px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;font-size:13.5px}
.meta div span{color:var(--muted)}
.seqbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;background:#f7f7f5;border:1px solid var(--line);border-radius:6px;padding:8px;max-height:140px;overflow:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
.card table{display:block;overflow-x:auto;max-width:100%}
code{word-break:break-all}
th,td{border-bottom:1px solid #e6e8eb;padding:4px 6px;text-align:left;vertical-align:top}
th{background:#f3f4f6;font-weight:600}
.st-complete{color:#166534;font-weight:600}.st-pending{color:var(--warn);font-weight:600}.st-failed,.st-unsupported,.st-no_output_returned{color:var(--bad);font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px}
.toggles fieldset{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0}
.toggles legend{font-size:12px;color:var(--muted);padding:0 4px}
.figbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px}
.figbar .sp{flex:1}
.figwrap{overflow:auto;border:1px solid #eceef1;border-radius:8px;background:#fff;max-height:none}
.figwrap svg{display:block;max-width:none}
.figwrap.fit svg{max-width:100%;height:auto}
.caption{font-size:12.5px;color:#333;background:#f8f8f6;border-left:3px solid #9fb7d3;padding:6px 9px;margin-top:8px}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{border-left:4px solid var(--warn);background:#fff7ed;padding:8px 10px;font-size:13px;margin:8px 0;border-radius:4px}
.badbox{border-left:4px solid var(--bad);background:#fef2f2;padding:8px 10px;font-size:13px;margin:8px 0;border-radius:4px}
details summary{cursor:pointer;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.25)}
.toast{position:fixed;bottom:16px;right:16px;background:#14263a;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:#14263a;color:#fff;border-color:#14263a}
.small{font-size:12px;overflow-wrap:anywhere}
img.rawplot{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
</style>
</head>
<body>
<header class="top"><h1 id="ttl"></h1><span class="sub" id="subttl"></span></header>
<div class="layout">
<aside>
  <input type="search" id="q" placeholder="Search gene, locus tag, accession, product…" aria-label="Search proteins">
  <div class="filters" id="filters">
    <label><input type="checkbox" data-f="span"> Membrane span (any main method)</label>
    <label><input type="checkbox" data-f="sp"> Signal peptide (any main method)</label>
    <label><input type="checkbox" data-f="dis"> Main-method disagreement</label>
    <label><input type="checkbox" data-f="flag"> Annotation flags / unsupported</label>
    <label><input type="checkbox" data-f="inc"> Incomplete predictions</label>
  </div>
  <select id="dd" aria-label="Select protein"></select>
  <div class="nav"><button id="prev">◀ Prev</button><button id="next">Next ▶</button></div>
  <div class="count" id="cnt"></div>
  <ul class="plist" id="plist"></ul>
  <button id="more" style="display:none;width:100%;margin-top:6px">Show more</button>
</aside>
<main>
  <div class="tabs" id="maintabs">
    <button data-tab="protein" class="on">Protein</button>
    <button data-tab="about">Dataset, methods &amp; caveats</button>
  </div>
  <div id="tab-protein"></div>
  <div id="tab-about" style="display:none"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script id="atlas-data" type="application/json">__DATA__</script>
<script id="atlas-assets" type="application/json">__ASSETS__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const ASSETS = JSON.parse(document.getElementById('atlas-assets').textContent);
const P = D.proteins;
const MAIN = D.main_methods, COMP = D.component_methods;
const ST_COL = {I:'#0d9488',O:'#d97706',M:'#334155',S:'#db2777',B:'#0891b2',P:'#65a30d'};
const ST_NAME = {I:'Inside (cytoplasmic side)',O:'Outside (non-cytoplasmic)',M:'Membrane span (α-helix)',S:'Signal peptide (precursor)',B:'Membrane span (β-strand)',P:'Periplasm (β-barrel model)'};
const ST_SHORT = {I:'Inside',O:'Outside',M:'TM',S:'SP',B:'β-TM',P:'Periplasm'};
const CH = {pos:'#1d4ed8',neg:'#dc2626',his:'#8b5cf6',hyd:'#f3dfb4',oth:'#ffffff',unk:'#9ca3af'};
const FONT = 'system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const STD = new Set('ACDEFGHIKLMNPQRSTVWY'.split(''));
function chClass(a){ if(a==='K'||a==='R')return'pos'; if(a==='D'||a==='E')return'neg'; if(a==='H')return'his'; if('AVILMFWY'.includes(a))return'hyd'; if(STD.has(a))return'oth'; return'unk'; }
const CH_LABEL = {pos:'K/R — generally positive side chain',neg:'D/E — generally negative side chain',his:'H — variable protonation (not treated as fixed charge)',hyd:'A/V/I/L/M/F/W/Y — declared hydrophobic/aromatic class (not a hydropathy prediction)',oth:'Other standard residues (unmarked)',unk:'Non-standard / unsupported symbol'};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200);}
function pname(p){ return p.gene || p.curator_alias || p.locus_tag || p.protein_id; }
function safe(s){ return String(s).replace(/[^A-Za-z0-9._-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,''); }

// ---------- state ----------
const state = { idx:0, filtered:[], shown:200, methods:new Set(MAIN.filter(m=>P.some(p=>p.method_status[m]==='complete'))), beadModel:null, mapModel:null, hyd:true, rowLen:50, win:null, fit:{figA:true,figB:false,figC:false,figD:true} };
try{ const s=JSON.parse(localStorage.getItem('dsc-atlas-prefs')||'{}'); if(typeof s.hyd==='boolean')state.hyd=s.hyd; if(s.rowLen)state.rowLen=s.rowLen; }catch(e){}
function savePrefs(){ try{localStorage.setItem('dsc-atlas-prefs',JSON.stringify({hyd:state.hyd,rowLen:state.rowLen}));}catch(e){} }

// ---------- header ----------
$('ttl').textContent = D.organism + ' — membrane topology & charge atlas';
$('subttl').textContent = `${D.accession} · ${P.length} annotated protein translations · predictions, not experimental evidence`;
document.title = `${D.key} Topology Atlas`;

// ---------- sidebar ----------
function searchText(p){ return [p.protein_id,p.gene,p.locus_tag,p.protein_accession,p.product,p.curator_alias,p.note,...(p.synonyms||[]),...(p.db_xref||[])].join(' ').toLowerCase(); }
const ST = P.map(searchText);
function incomplete(p){ return [...MAIN,...COMP].some(m=>p.method_status[m]!=='complete'); }
function applyFilters(){
  const q=$('q').value.trim().toLowerCase();
  const f={}; document.querySelectorAll('#filters input').forEach(i=>f[i.dataset.f]=i.checked);
  state.filtered = P.map((p,i)=>i).filter(i=>{
    const p=P[i];
    if(q && !q.split(/\s+/).every(t=>ST[i].includes(t))) return false;
    if(f.span && !p.any_membrane_span) return false;
    if(f.sp && !p.any_signal_peptide) return false;
    if(f.dis && !p.disagreements.length) return false;
    if(f.flag && !(p.annotation_flags.length || [...MAIN].some(m=>p.method_status[m]==='unsupported'))) return false;
    if(f.inc && !incomplete(p)) return false;
    return true;
  });
  state.shown=200; renderList();
}
function renderList(){
  const ul=$('plist'); const items=state.filtered.slice(0,state.shown);
  ul.innerHTML = items.map(i=>{const p=P[i];
    const tags=(p.any_membrane_span?'<span class="tag tm">TM</span>':'')+(p.any_signal_peptide?'<span class="tag sp">SP</span>':'')+(p.disagreements.length?'<span class="tag dis">disagree</span>':'')+(incomplete(p)?'<span class="tag inc">incomplete</span>':'')+(p.annotation_flags.length?'<span class="tag flag">flag</span>':'');
    return `<li data-i="${i}" class="${i===state.idx?'sel':''}"><b>${esc(pname(p))}</b> ${tags}<div class="pm">${esc(p.locus_tag)} · ${p.length} aa · ${esc(p.product)}</div></li>`;}).join('');
  $('cnt').textContent = `${state.filtered.length} of ${P.length} proteins match`;
  $('more').style.display = state.filtered.length>state.shown?'block':'none';
  const dd=$('dd'); dd.innerHTML = state.filtered.map(i=>`<option value="${i}" ${i===state.idx?'selected':''}>${esc(pname(P[i]))} — ${esc(P[i].locus_tag)} (${P[i].length} aa)</option>`).join('');
}
$('plist').addEventListener('click',e=>{const li=e.target.closest('li');if(li)select(+li.dataset.i);});
$('dd').addEventListener('change',e=>select(+e.target.value));
$('more').addEventListener('click',()=>{state.shown+=200;renderList();});
$('q').addEventListener('input',applyFilters);
document.querySelectorAll('#filters input').forEach(i=>i.addEventListener('change',applyFilters));
function step(d){ const L=state.filtered; if(!L.length)return; let k=L.indexOf(state.idx); k = k<0?0:(k+d+L.length)%L.length; select(L[k]); }
$('prev').onclick=()=>step(-1); $('next').onclick=()=>step(1);
document.querySelectorAll('#maintabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#maintabs button').forEach(x=>x.classList.toggle('on',x===b));$('tab-protein').style.display=b.dataset.tab==='protein'?'':'none';$('tab-about').style.display=b.dataset.tab==='about'?'':'none';});

function select(i){ state.idx=i; state.win=null; const p=P[i];
  const avail=[...MAIN,...COMP].filter(m=>p.method_status[m]==='complete');
  if(!avail.includes(state.beadModel)) state.beadModel = avail[0]||null;
  if(!avail.includes(state.mapModel)) state.mapModel = null;
  try{history.replaceState(null,'','#'+encodeURIComponent(p.protein_id));}catch(e){}
  renderList(); renderProtein(); }

// ---------- geometry helpers ----------
function segsOf(pred){ return pred.segments; }
function svgOpen(w,h,title){ return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="${FONT}"><title>${esc(title)}</title><rect width="${w}" height="${h}" fill="#ffffff"/>`; }
let measureCtx=null;
function textW(t,size,weight){ if(!measureCtx){measureCtx=document.createElement('canvas').getContext('2d');} measureCtx.font=`${weight||400} ${size}px ${FONT}`; return measureCtx.measureText(t).width; }
function rr(n){ return Math.round(n*10)/10; }

// ---------- Figure D: linear method comparison ----------
function figTracks(p, methods){
  const L=p.length, left=170, right=40, W=Math.max(900, Math.min(1500, 260+L*2.2)), tw=W-left-right, sc=tw/L;
  const rowH=34, top=58; const rows=methods.length; const hasRel=methods.includes('TOPCONS2') && p.predictions.TOPCONS2 && p.predictions.TOPCONS2.reliability && p.predictions.TOPCONS2.reliability.length;
  const H=top+rows*rowH+(hasRel?70:0)+110;
  const x=pos=>left+(pos-1)*sc;
  let s=svgOpen(W,H,`${pname(p)} method comparison`);
  s+=`<text x="${left}" y="26" font-size="20" font-weight="700" fill="#1b1f24">${esc(pname(p))} — predicted topology by method</text>`;
  s+=`<text x="${left}" y="46" font-size="13" fill="#5b6470">${esc(D.organism)} · ${esc(p.locus_tag)} · residues 1–${L} (1-based precursor numbering) · categorical one-best assignments, not confidence scores</text>`;
  methods.forEach((m,k)=>{ const y=top+k*rowH; const pr=p.predictions[m]; const isComp=COMP.includes(m);
    s+=`<text x="${left-10}" y="${y+21}" font-size="${isComp?13:15}" font-weight="${isComp?500:700}" text-anchor="end" fill="${isComp?'#5b6470':'#1b1f24'}">${esc(m)}${isComp?' (component)':''}</text>`;
    if(!pr){ s+=`<rect x="${left}" y="${y+6}" width="${tw}" height="20" fill="#f3f4f6" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="${left+8}" y="${y+21}" font-size="13" fill="#b91c1c">${esc(p.method_status[m]||'missing')} — no prediction available</text>`; return; }
    pr.segments.forEach(g=>{ const h=g.label==='M'||g.label==='B'?24:(g.label==='S'?20:14); const yy=y+16-h/2;
      s+=`<rect x="${rr(x(g.start))}" y="${yy}" width="${rr(Math.max(0.6,(g.stop-g.start+1)*sc))}" height="${h}" fill="${ST_COL[g.label]}" ${g.label==='S'?'stroke="#831843" stroke-width="1"':''}><title>${m}: ${ST_NAME[g.label]} ${g.start}–${g.stop} (${g.stop-g.start+1} aa)</title></rect>`; });
  });
  let yb=top+rows*rowH+8;
  if(hasRel){ const rel=p.predictions.TOPCONS2.reliability; const h=44;
    s+=`<text x="${left-10}" y="${yb+20}" font-size="12.5" text-anchor="end" fill="#5b6470">TOPCONS2 reliability</text><text x="${left-10}" y="${yb+35}" font-size="11" text-anchor="end" fill="#5b6470">(tool-provided, 0–1)</text>`;
    s+=`<rect x="${left}" y="${yb}" width="${tw}" height="${h}" fill="#fafafa" stroke="#e5e7eb"/>`;
    let d=''; let prev=null; rel.forEach(([pos,v])=>{ const X=rr(x(pos)+sc/2), Y=rr(yb+h-v*h); d+=(prev!==null&&pos===prev+1?'L':'M')+X+' '+Y; prev=pos; });
    s+=`<path d="${d}" fill="none" stroke="#1f4e79" stroke-width="1.6"/><text x="${left+tw+4}" y="${yb+8}" font-size="10" fill="#5b6470">1</text><text x="${left+tw+4}" y="${yb+h}" font-size="10" fill="#5b6470">0</text>`;
    s+=`<text x="${left}" y="${yb+h+14}" font-size="11" fill="#5b6470">Reliability reported by TOPCONS2 for positions ${rel[0][0]}–${rel[rel.length-1][0]} only; positions without a value are left blank.</text>`;
    yb+=h+24; }
  s+=axis(left,tw,L,yb+4,sc);
  s+=legendRow(left,yb+48,['I','O','M','S','B','P'].filter(c=>methods.some(m=>p.predictions[m]&&p.predictions[m].labels.includes(c))));
  s+='</svg>'; return s;
}
function niceStep(L,px){ const target=L/(px/70); const c=[1,2,5,10,20,25,50,100,200,250,500,1000]; return c.find(v=>v>=target)||1000; }
function axis(left,tw,L,y,sc){ const st=niceStep(L,tw); let s=`<line x1="${left}" y1="${y}" x2="${left+tw}" y2="${y}" stroke="#6b7280"/>`;
  const ticks=[1]; for(let v=st;v<L;v+=st)ticks.push(v); ticks.push(L);
  ticks.forEach((v,i)=>{ const X=rr(left+(v-0.5)*sc); if(i>0&&i<ticks.length-1&&L-v<st*0.35)return; s+=`<line x1="${X}" y1="${y}" x2="${X}" y2="${y+5}" stroke="#6b7280"/><text x="${X}" y="${y+18}" font-size="12" text-anchor="middle" fill="#374151">${v}</text>`; });
  s+=`<text x="${left+tw}" y="${y+34}" font-size="11.5" text-anchor="end" fill="#5b6470">residue position (aa)</text>`; return s; }
function legendRow(x,y,codes){ let s=''; let cx=x; codes.forEach(c=>{ s+=`<rect x="${cx}" y="${y-11}" width="14" height="14" rx="3" fill="${ST_COL[c]}"/><text x="${cx+19}" y="${y}" font-size="12.5" fill="#1b1f24">${esc(ST_NAME[c])}</text>`; cx+=26+textW(ST_NAME[c],12.5); }); return s; }

// ---------- Figure A: presentation orientation cartoon ----------
function figOrientation(p, methods){
  const L=p.length, left=80, right=80, W=1240, tw=W-left-right, sc=tw/L;
  const panels=methods.map(m=>orientationPanel(p,m,left,tw,sc));
  const top=70; let H=top; panels.forEach(pa=>H+=pa.h+18); H+=58;
  let s=svgOpen(W,H,`${pname(p)} membrane orientation`);
  s+=`<defs><pattern id="sphatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbcfe8"/><line x1="0" y1="0" x2="0" y2="7" stroke="#db2777" stroke-width="3"/></pattern></defs>`;
  s+=`<text x="${left}" y="32" font-size="24" font-weight="800" fill="#14263a">${esc(pname(p))} · predicted membrane orientation</text>`;
  s+=`<text x="${left}" y="54" font-size="14" fill="#5b6470">${esc(D.organism)} · ${esc(p.product)} · ${L} aa · computational predictions</text>`;
  let y=top; panels.forEach(pa=>{ s+=`<g transform="translate(0,${y})">${pa.svg}</g>`; y+=pa.h+18; });
  s+=`<text x="${left}" y="${y+10}" font-size="12.5" fill="#374151">Scale: horizontal extent of every loop, tail and span ∝ residue count on one shared axis (1 aa = ${rr(sc)} px). Membrane depth, loop height and path shape are schematic, not physical distances or a 3D fold.</text>`;
  s+=`<text x="${left}" y="${y+28}" font-size="12.5" fill="#374151">Inside/outside are model-defined sides of a membrane; for a phage protein the relevant host membrane is not assigned here. Signal peptides use precursor numbering; cleavage is predicted, not demonstrated.</text>`;
  s+='</svg>'; return s;
}
function placeLabels(items, minX, maxX){ // items: {cx,text,w} -> assigns lane
  const lanes=[]; items.sort((a,b)=>a.cx-b.cx);
  items.forEach(it=>{ let x0=Math.max(minX,Math.min(maxX-it.w,it.cx-it.w/2)); it.x0=x0; let l=0; while(lanes[l]!==undefined && lanes[l]>x0-10) l++; lanes[l]=x0+it.w; it.lane=l; });
  return lanes.length; }
function orientationPanel(p,m,left,tw,sc){
  const pr=p.predictions[m]; const L=p.length; const x=pos=>left+(pos-1)*sc;
  const head=`<text x="${left-60}" y="25" font-size="21" font-weight="800" fill="#14263a">${esc(m)}${COMP.includes(m)?' <tspan font-size="13" font-weight="500" fill="#5b6470">(TOPCONS2 component)</tspan>':''}</text>`;
  if(!pr){ return {h:70, svg:head+`<text x="${left}" y="54" font-size="16" fill="#b91c1c">${esc(p.method_status[m]||'missing')} — no prediction available for this method</text>`}; }
  const segs=pr.segments; const hasSpan=segs.some(g=>g.label==='M'); const hasBeta=segs.some(g=>g.label==='B'||g.label==='P');
  if(!hasSpan || hasBeta){
    // linear fallback
    let s=head; const y=62;
    const msg = hasBeta ? 'β-barrel-type prediction: linear map (P = periplasm, O = extracellular; no α-helical cartoon)' : (pr.signal_peptide ? 'no membrane span predicted · signal peptide predicted (precursor)' : 'no membrane span predicted');

    let items=abbreviate(posList); if(mode==='ntail') items=items.slice().reverse(); // lay from face outward
    const n=items.length; let ncol=Math.max(1,Math.ceil(n/depth)); if(mode==='loop'&&ncol%2) ncol++; if(mode==='loop'&&ncol<2&&n>1) ncol=2;
    const per=Math.ceil(n/ncol); const cols=[]; for(let c=0;c<ncol;c++) cols.push(items.slice(c*per,(c+1)*per)); while(cols.length&&!cols[cols.length-1].length) cols.pop();

  s+=`<path d="${d}" stroke="#4b5563" stroke-width="2.2" fill="none"/>`;
  // signal peptide run
  if(spBeads.length){ const y=top-34; const x0=60; s+=`<text x="${x0-6}" y="${y-18}" font-size="13" font-weight="700" fill="#db2777">Signal peptide ${spSeg.start}–${spSeg.stop} (precursor; predicted) — placement relative to the membrane not modeled</text>`;
    let dd=''; spBeads.forEach((q,i)=>{ if(i) dd+=`M${x0+(i-1)*sp} ${y}L${x0+i*sp} ${y}`; }); s+=`<path d="${dd}" stroke="#db2777" stroke-width="2"/>`;
    spBeads.forEach((q,i)=>s+=beadSvg(x0+i*sp,y,seq[q-1],q,'S',m));
    const fb=beads[0]; s+=`<path d="M${x0+(spBeads.length-1)*sp} ${y}C${x0+(spBeads.length-1)*sp+40} ${y} ${fb.x} ${fb.y-60} ${fb.x} ${fb.y}" stroke="#db2777" stroke-width="2" stroke-dasharray="5 4" fill="none"/>`;
    s+=termBadge(x0-26,y,'N'); }
  beads.forEach(b=>{ if(b.gap){ const n=b.gap[1]-b.gap[0]+1; s+=`<g><title>Omitted in this view: residues ${b.gap[0]}–${b.gap[1]} (${n} aa); all are shown in the full sequence map</title><rect x="${rr(b.x-r-4)}" y="${rr(b.y-r)}" width="${BEAD.d+8}" height="${BEAD.d}" rx="10" fill="#fff" stroke="#111827" stroke-dasharray="3 2"/><text x="${rr(b.x)}" y="${rr(b.y+5)}" font-size="14" font-weight="800" text-anchor="middle">…</text></g>`; } else s+=beadSvg(b.x,b.y,seq[b.pos-1],b.pos,b.state,m); });
  // gap labels
  // gap explanations are given in the footer (keyed to the dashed '…' bead) to avoid label/bead collisions
  // termini
  const first=beads[0], last=beads[beads.length-1];
  if(!spBeads.length) s+=termBadge(first.x-28, first.y,'N');
  s+=termBadge(last.x+28, last.y,'C');
  // charge legend
  let lx=40; const ly=H-62; ['pos','neg','his'].concat(state.hyd?['hyd']:[]).concat(['oth']).forEach(c=>{const t=CH_LABEL[c].split(' — ')[0]; s+=`<circle cx="${lx+7}" cy="${ly-4}" r="7" fill="${CH[c]}" stroke="#374151" stroke-width=".8" ${c==='his'?'stroke-dasharray="2 1.5"':''}/><text x="${lx+18}" y="${ly}" font-size="12.5">${esc(t)}</text>`; lx+=34+textW(t,12.5);});
  s+=`<text x="40" y="${H-40}" font-size="11.5" fill="#5b6470">Beads in the membrane band = residues the model assigns to a membrane span (2-column helix packing is illustrative). Charge colours are approximate side-chain classes; they are context, not a topology predictor.</text>`;

  gaps.forEach((g,i)=>{ s+=`<text x="40" y="${H-80-(gaps.length-1-i)*17}" font-size="13" font-weight="700" fill="#111827">Dashed “…” bead${gaps.length>1?' '+(i+1):''}: residues ${g.from}–${g.to} omitted in this view (${g.to-g.from+1} aa) — every residue is shown in the full sequence map (B).</text>`; });
  s+=`<text x="40" y="${H-22}" font-size="11.5" fill="#5b6470">Accounting: ${shown} residues drawn + ${omitted} explicitly omitted = ${shown+omitted} of ${L}.</text>`;
  s+='</svg>';

}
function beadSvg(x,y,aa,pos,st,m){ const c=chClass(aa); const fill=(c==='hyd'&&!state.hyd)?CH.oth:CH[c]; const r=BEAD.d/2;
  const ring = ST_COL[st]||'#6b7280';
  return `<g><title>${aa}${pos} · ${ST_NAME[st]||st} (${m}) · ${CH_LABEL[c].split(' — ')[0]}</title><circle cx="${rr(x)}" cy="${rr(y)}" r="${r}" fill="${fill}" stroke="${ring}" stroke-width="${st==='M'?2.6:1.8}" ${c==='his'?'stroke-dasharray="3 2"':''}/><text x="${rr(x)}" y="${rr(y+4.5)}" font-size="12.5" font-weight="700" text-anchor="middle" font-family="${MONO}" fill="${c==='pos'||c==='neg'||c==='his'?'#fff':'#111827'}">${esc(aa)}</text></g>`; }
function termBadge(x,y,t){ return `<circle cx="${rr(x)}" cy="${rr(y)}" r="12" fill="#14263a"/><text x="${rr(x)}" y="${rr(y+5)}" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">${t}</text>`; }
function simpleMsg(title,msg){ return svgOpen(760,90,title)+`<text x="20" y="34" font-size="18" font-weight="700">${esc(title)}</text><text x="20" y="64" font-size="15" fill="#b91c1c">${esc(msg)}</text></svg>`; }
function beadChainNoMembrane(p,pr,m,msg){ const seq=p.sequence, L=p.length, per=25, sp=BEAD.sp; const rows=Math.ceil(L/per); const W=Math.max(760,80+per*sp+40), H=110+rows*sp*1.5+80;
  let s=svgOpen(W,H,`${pname(p)} residue-bead view (${m})`);
  s+=`<text x="40" y="30" font-size="20" font-weight="700" fill="#14263a">${esc(pname(p))} · residue-bead view · ${esc(m)}</text><text x="40" y="52" font-size="14" font-weight="600" fill="#b45309">${esc(msg)}</text>`;
  const pts=[]; for(let i=0;i<L;i++){ const row=Math.floor(i/per), k=i%per; const x=60+(row%2? (per-1-k):k)*sp; const y=96+row*sp*1.5; pts.push([x,y]); }
  let d=''; pts.forEach((q,i)=>{ d+=(i?'L':'M')+q[0]+' '+q[1]; }); s+=`<path d="${d}" stroke="#4b5563" stroke-width="2" fill="none"/>`;
  pts.forEach((q,i)=>s+=beadSvg(q[0],q[1],seq[i],i+1,pr.labels[i],m));
  s+=termBadge(pts[0][0]-26,pts[0][1],'N')+termBadge(pts[L-1][0]+(Math.floor((L-1)/per)%2?-26:26),pts[L-1][1],'C');
  s+=`<text x="40" y="${H-30}" font-size="11.5" fill="#5b6470">Bead ring colour = model state: ${['I','O','M','S','B','P'].filter(c=>pr.labels.includes(c)).map(c=>ST_NAME[c]).join('; ')}; boustrophedon layout is arbitrary. All ${L} residues drawn.</text></svg>`; return s; }

// ---------- charge-by-region table ----------
function regionTable(p,m){ const pr=p.predictions[m]; if(!pr) return '<p class="note">No prediction.</p>';
  const rows=pr.segments.map(g=>{ const sub=p.sequence.slice(g.start-1,g.stop); const n=sub.length; const cnt=c=>[...sub].filter(a=>c.includes(a)).length; const kr=cnt('KR'), de=cnt('DE'), h=cnt('H'), hy=cnt('AVILMFWY');
    return `<tr><td><span class="sw" style="background:${ST_COL[g.label]}"></span>${esc(ST_NAME[g.label])}</td><td>${g.start}–${g.stop}</td><td>${n}</td><td>${kr}</td><td>${(kr/n).toFixed(3)}</td><td>${de}</td><td>${(de/n).toFixed(3)}</td><td>${h}</td><td>${(hy/n).toFixed(2)}</td></tr>`; }).join('');
  let pi='';
  if(pr.spans.length && pr.spans.every(s=>s[2]==='M')){ const agg=lab=>{ let n=0,kr=0; pr.segments.filter(g=>g.label===lab).forEach(g=>{const sub=p.sequence.slice(g.start-1,g.stop); n+=sub.length; kr+=[...sub].filter(a=>a==='K'||a==='R').length;}); return {n,kr}; };
    const I=agg('I'), O=agg('O');
    pi=`<p class="note">Positive-inside context (${esc(m)}): inside-assigned regions ${I.kr} K/R in ${I.n} aa (${I.n?(I.kr/I.n).toFixed(3):'–'} per residue); outside-assigned regions ${O.kr} K/R in ${O.n} aa (${O.n?(O.kr/O.n).toFixed(3):'–'} per residue). A tendency in helical membrane proteins, not evidence for this protein's orientation; long globular domains dilute densities.</p>`; }
  return `<table><thead><tr><th>${esc(m)} region</th><th>Range</th><th>Length</th><th>K+R</th><th>K+R / aa</th><th>D+E</th><th>D+E / aa</th><th>H</th><th>Hydrophobic/aromatic fraction</th></tr></thead><tbody>${rows}</tbody></table>${pi}`; }

// ---------- export ----------
function fname(p,method,fig,range){ return safe(`${D.key}_${p.locus_tag||p.protein_id}_${pname(p)}_${method}_${fig}_${range?range[0]+'-'+range[1]:'1-'+p.length}`); }
function download(name,blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function svgBlob(svg){ return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+svg],{type:'image/svg+xml'}); }
const MAX_SIDE=16000, MAX_AREA=120e6;
function svgToPng(svg, scale){ return new Promise((res,rej)=>{ const m=svg.match(/width="(\d+(?:\.\d+)?)" height="(\d+(?:\.\d+)?)"/); const w=+m[1], h=+m[2];
  let sc=scale; while(sc>0.25 && (w*sc>MAX_SIDE || h*sc>MAX_SIDE || w*h*sc*sc>MAX_AREA)) sc/=1.25;
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res({blob:b,scale:sc,w:c.width,h:c.height}):rej(new Error('canvas toBlob failed')),'image/png'); };
  img.onerror=()=>rej(new Error('SVG rasterization failed')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }); }
async function copyImage(svg,name){ try{ if(!navigator.clipboard||!window.ClipboardItem) throw new Error('no clipboard'); const r=await svgToPng(svg,2); await navigator.clipboard.write([new ClipboardItem({'image/png':r.blob})]); toast('Image copied to clipboard'); }catch(e){ const r=await svgToPng(svg,2); download(name+'.png',r.blob); toast('Clipboard unavailable — downloaded PNG instead'); } }
function copyText(t){ (navigator.clipboard&&navigator.clipboard.writeText? navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Caption copied')).catch(()=>{ download('caption.txt',new Blob([t],{type:'text/plain'})); toast('Clipboard unavailable — caption downloaded'); }); }
function figBlock(id,title,svg,caption,name,extraBar){
  return `<div class="card" id="${id}"><h3>${title}</h3><div class="figbar">${extraBar||''}<span class="sp"></span><button data-act="svg">SVG</button><button data-act="png2">PNG 2×</button><button data-act="png4">PNG 4×</button><button data-act="copy">Copy image</button><button data-act="cap">Copy caption</button><label class="small"><input type="checkbox" data-act="fit" ${state.fit[id]?'checked':''}> fit width</label></div><div class="figwrap ${state.fit[id]?'fit':''}">${svg}</div><div class="caption">${esc(caption)}</div></div>`; }
function wireFig(id,getSvg,caption,name){ const el=$(id); if(!el)return; el.querySelectorAll('.figbar [data-act]').forEach(b=>{ const act=b.dataset.act;
  if(act==='fit'){ b.onchange=()=>{state.fit[id]=b.checked; el.querySelector('.figwrap').classList.toggle('fit',b.checked);}; return; }
  b.onclick=async()=>{ const svg=getSvg(); try{
    if(act==='svg') download(name+'.svg',svgBlob(svg));
    if(act==='png2'||act==='png4'){ const r=await svgToPng(svg,act==='png2'?2:4); download(name+'.png',r.blob); if(r.scale<(act==='png2'?2:4)) toast(`PNG reduced to ${r.scale.toFixed(2)}× (${r.w}×${r.h}) for browser canvas limits; SVG keeps full detail`); }
    if(act==='copy') await copyImage(svg,name);
    if(act==='cap') copyText(caption);
  }catch(e){ toast('Export failed: '+e.message); } }; }); }

  $('rawplots').innerHTML = rp || '<p class="note">No server-provided plots for this protein.</p>';
}
function summaryCsv(){ const cols=['protein_id','gene','curator_alias','locus_tag','protein_accession','product','length','sequence_sha256']; const ms=[...MAIN,...COMP];
  const q=v=>{v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  let out=[...cols,...ms.flatMap(m=>[m+'_status',m+'_spans',m+'_signal_peptide',m+'_segments']),'disagreements'].join(',')+'\n';
  P.forEach(p=>{ out+= [...cols.map(c=>q(p[c])), ...ms.flatMap(m=>{const pr=p.predictions[m]; return [q(p.method_status[m]), q(pr?pr.spans.map(s=>s[0]+'-'+s[1]+(s[2]==='B'?'(beta)':'')).join(';'):''), q(pr?(pr.sp_range?pr.sp_range.join('-'):'none'):''), q(pr?pr.segments.map(g=>g.label+g.start+'-'+g.stop).join(';'):'')];}), q(p.disagreements.join(';'))].join(',')+'\n'; });
  return out; }

// ---------- about tab ----------
function renderAbout(){
  const cov=D.coverage; const ip=D.input_provenance;
  const covRows=[...MAIN,...COMP].map(m=>{const c=cov[m]; return `<tr><td>${COMP.includes(m)?'&nbsp;&nbsp;↳ ':''}${esc(m)}</td><td>${c.complete} / ${c.eligible}</td><td>${c.complete} / ${c.inventory}</td><td>${esc(Object.entries(c.status_counts).map(([k,v])=>`${k}: ${v}`).join(', '))}</td></tr>`;}).join('');
  const jobs=Object.entries(D.jobs).map(([m,js])=>js.map(j=>`<tr><td>${esc(m)}</td><td>${esc(j.batch??'')}${j.format?' ('+esc(j.format)+')':''}</td><td>${esc(j.jobid||j.job_id||'—')}</td><td>${esc(j.status)}</td><td>${esc(j.submitted_utc||'')}</td><td class="small"><code>${esc((j.fasta_sha256||'').slice(0,16))}…</code></td></tr>`).join('')).join('');
  const allDone = MAIN.every(m=>cov[m].complete===cov[m].inventory);
  $('tab-about').innerHTML = `
  <div class="card"><h2>Dataset</h2>
   <p><b>${esc(D.organism)}</b> · RefSeq <b>${esc(D.accession)}</b> (${esc(ip.ncbi_summary.title)}; ${ip.ncbi_summary.slen} nt, ${esc(ip.ncbi_summary.topology)}; NCBI record updated ${esc(ip.ncbi_summary.updatedate)}). ${esc(D.host_note)}</p>
   <p>Scope: all ${P.length} CDS features with an annotated <code>/translation</code> (${D.n_cds} CDS features; ${D.pseudogenes.length} pseudogenes or CDSs without translation). Sequences are used exactly as annotated; no trimming, padding or residue substitution.</p>
   <table><thead><tr><th>Input file</th><th>Source URL</th><th>Retrieved (UTC)</th><th>SHA-256</th></tr></thead><tbody>${ip.files.map(f=>`<tr><td>${esc(f.file)}</td><td class="small">${esc(f.url)}</td><td>${esc(f.retrieved_utc)}</td><td class="small"><code>${esc(f.sha256)}</code></td></tr>`).join('')}</tbody></table>
   <p class="note">Coordinates: ${esc(D.coordinate_convention)}. Atlas data generated ${esc(D.generated_utc)}.</p>
   ${allDone?'':'<div class="badbox"><b>Partial atlas:</b> at least one main method has incomplete coverage (see table). Missing predictions are shown as missing, never substituted.</div>'}
  </div>
  <div class="card"><h3>Method coverage</h3><table><thead><tr><th>Method</th><th>Complete / eligible</th><th>Complete / full inventory</th><th>Status counts</th></tr></thead><tbody>${covRows}</tbody></table>
   <h3 style="margin-top:12px">Submission records</h3><table><thead><tr><th>Method</th><th>Batch</th><th>Job ID</th><th>Status</th><th>Submitted</th><th>Batch FASTA SHA-256</th></tr></thead><tbody>${jobs}</tbody></table></div>
  <div class="card"><h3>Methods</h3><ul>
   <li><b>Phobius</b> — HMM combining α-helical TM topology and signal-peptide prediction. Run on the Phobius server JSON API (phobius.sbc.su.se). Native labels n/h/c = signal-peptide regions, C = cleavage-boundary marker on the first mature residue (mapped to the following region, never counted as signal peptide), i/o/O = inside/outside, M = membrane. Käll, Krogh &amp; Sonnhammer (2004) <a href="https://doi.org/10.1016/j.jmb.2004.03.016">J Mol Biol 338:1027</a>.</li>
   <li><b>DeepTMHMM</b> — deep-learning model for α-helical and β-barrel topology plus signal peptides; run as BioLib app DTU/DeepTMHMM. States I, O, M, S, B (β membrane), P (periplasm in β-barrel predictions). No model version is exposed in the output. Hallgren et al. (2022) <a href="https://doi.org/10.1101/2022.04.08.487609">bioRxiv 2022.04.08.487609</a>.</li>
   <li><b>TOPCONS2</b> — consensus of OCTOPUS, Philius, PolyPhobius, SCAMPI and SPOCTOPUS with signal-peptide and homology handling (topcons.net WSDL API). Component outputs are retained as returned. The server may return cached results computed earlier for an identical sequence; each prediction's generation date and cache status are recorded. Tsirigos et al. (2015) <a href="https://doi.org/10.1093/nar/gkv485">Nucleic Acids Res 43:W401</a>.</li>
   <li>Components: OCTOPUS (Viklund &amp; Elofsson 2008, <a href="https://doi.org/10.1093/bioinformatics/btn221">Bioinformatics 24:1662</a>), Philius (Reynolds et al. 2008, <a href="https://doi.org/10.1371/journal.pcbi.1000213">PLoS Comput Biol 4:e1000213</a>), PolyPhobius (Käll et al. 2005, <a href="https://doi.org/10.1093/bioinformatics/bti1014">Bioinformatics 21 Suppl 1:i251</a>), SCAMPI (Bernsel et al. 2008, <a href="https://doi.org/10.1110/ps.034470.108">Protein Sci 17:1269</a>), SPOCTOPUS (Viklund et al. 2008, <a href="https://doi.org/10.1093/bioinformatics/btn550">Bioinformatics 24:2928</a>).</li>
  </ul>
  <h3>Normalized states</h3><ul>${Object.entries(D.state_definitions).map(([k,v])=>`<li><span class="sw" style="background:${ST_COL[k]}"></span><b>${k}</b> — ${esc(v)}</li>`).join('')}</ul></div>
  <div class="card"><h3>Reading the figures — cautions</h3><ul>
   <li>All topology calls are computational predictions. Where experimental topology is known it is not encoded here.</li>
   <li>Inside/outside labels on a protein with no predicted membrane span do not establish localization.</li>
   <li>A predicted signal peptide is not demonstrated cleavage, lipidation or a permanent anchor. Precursor numbering is kept throughout.</li>
   <li>For bacteriophage proteins, "inside/outside" refers to a generic membrane context (cytoplasmic vs non-cytoplasmic side); no specific host membrane is assigned and these are not viral-envelope predictions.</li>
   <li><b>Positive-inside tendency.</b> In α-helical membrane proteins, Lys/Arg are statistically enriched in cytoplasmic loops, especially in bacteria (von Heijne 1986, <a href="https://doi.org/10.1002/j.1460-2075.1986.tb04655.x">EMBO J 5:3021</a>; von Heijne 1992, <a href="https://doi.org/10.1016/0022-2836(92)90934-C">J Mol Biol 225:487</a>). Stretches of ~15–25 hydrophobic residues are consistent with membrane-spanning helices (cf. Hessa et al. 2005, <a href="https://doi.org/10.1038/nature03216">Nature 433:377</a>). These are tendencies, not proofs or sufficient explanations for any one residue's placement, and they do not apply directly to β-barrels. Region tables report densities so regions of different lengths are not compared by raw counts.</li>
   <li>Charge classes (K/R, D/E, H, hydrophobic/aromatic) are simplified side-chain categories, not measured charges, net charge, pI or electrostatic calculations.</li>
  </ul></div>`;
}

// ---------- init ----------
renderAbout(); applyFilters();
const h=decodeURIComponent(location.hash.slice(1)); const hi=P.findIndex(p=>p.protein_id===h);
select(hi>=0?hi:(state.filtered[0]??0));
</script>
