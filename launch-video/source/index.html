<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #121009;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-logo"
        class="scene"
        data-composition-id="01-logo"
        data-composition-src="compositions/frames/01-logo.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-headline"
        class="scene"
        data-composition-id="02-headline"
        data-composition-src="compositions/frames/02-headline.html"
        data-start="3"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-feature-lysis"
        class="scene"
        data-composition-id="03-feature-lysis"
        data-composition-src="compositions/frames/03-feature-lysis.html"
        data-start="8"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-feature-playground"
        class="scene"
        data-composition-id="04-feature-playground"
        data-composition-src="compositions/frames/04-feature-playground.html"
        data-start="13"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-feature-tools"
        class="scene"
        data-composition-id="05-feature-tools"
        data-composition-src="compositions/frames/05-feature-tools.html"
        data-start="18"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="23"
        data-duration="7"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-logo", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 3);
        tl.fromTo("#el-02-headline", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 3);
        tl.to("#el-02-headline", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-03-feature-lysis", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to("#el-03-feature-lysis", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.fromTo("#el-04-feature-playground", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 13);
        tl.to("#el-04-feature-playground", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.fromTo("#el-05-feature-tools", { x: 1080, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.to("#el-05-feature-tools", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
